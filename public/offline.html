<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You are offline - TalkLive</title>
<!-- Never index the offline shell: it is a fallback the service worker serves
     when the network is gone, not a page anyone should arrive at from search. -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0b0f1a" />
<style>
  /* Fully self-contained: a page shown precisely when the network is
     unavailable cannot depend on fetching a stylesheet. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0b0f1a;
    color: #e8ecf6;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card { max-width: 420px; }
  img { width: 72px; height: 72px; margin-bottom: 18px; }
  h1 { font-size: 1.5rem; margin: 0 0 10px; }
  p { color: #9aa3b8; margin: 0 0 22px; }
  button {
    background: #6c5ce7;
    color: #fff;
    border: 0;
    border-radius: 12px;
    padding: 13px 26px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .hint { font-size: 0.85rem; margin-top: 18px; color: #6b7488; }
</style>
</head>
<body>
  <div class="card">
    <img src="/favicon.svg" alt="TalkLive" width="72" height="72" />
    <h1>You are offline</h1>
    <p>TalkLive needs a connection to match you with someone. Reconnect and try again - it takes one tap.</p>
    <button type="button" id="retry">Try again</button>
    <p class="hint">This page works offline so you can get straight back in.</p>
  </div>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    location.replace('/');
  });
  // Come back on our own as soon as the device reports a connection, so the
  // user does not have to notice and tap.
  window.addEventListener('online', function () { location.replace('/'); });
</script>
</body>
</html>
