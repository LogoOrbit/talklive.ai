<html><head><meta charset="utf-8"><title>TalkLive Ads</title>

.pu{background:linear-gradient(90deg,#c4b5fd,#8b7cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.gr{background:linear-gradient(90deg,#4ade80,#22c55e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rd{color:#f87171}

.kin > div.xs{font-size:48px;letter-spacing:-.5px;font-weight:700;color:#b8bdd6}

#screen img{position:absolute;inset:0;width:100%;height:100%}
#island{position:absolute;left:50%;top:22px;width:190px;height:52px;margin-left:-95px;border-radius:26px;background:#000;z-index:5}
#rip{position:absolute;border-radius:50%;border:6px solid rgba(255,255,255,.9);z-index:6}
#fin{position:absolute;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.85);z-index:7;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#hl{position:absolute;border-radius:28px;border:5px solid #22d3ee;box-shadow:0 0 40px rgba(34,211,238,.6);z-index:6;opacity:0}
.chip{position:absolute;padding:22px 34px;border-radius:999px;font-weight:700;font-size:42px;background:rgba(20,24,48,.86);border:2px solid rgba(255,255,255,.14);

.chip b{display:inline-block;width:18px;height:18px;border-radius:50%}

.cap.pov{top:150px;font-size:60px;letter-spacing:-.5px;font-weight:700;line-height:1.55}

function kinAt(t) {
  AD.kin.forEach((k, i) => {
    const el = $('k' + i); const on = t >= k.a && t <= k.b; el.style.display = on ? 'flex' : 'none'; if (!on) return;
    const out = eio(prog(t, k.b - .25, k.b));
    el.style.opacity = 1 - out; el.style.transform = `scale(${1 + out * .15})`; el.style.filter = `blur(${out * 14}px)`;

      const line = el.children[j]; const p = prog(t, at, at + .32);
      line.style.opacity = clamp(p * 3); line.style.transform = `scale(${lerp(1.6, 1, eo(p))})`;

    n.textContent.split(/(\s+)/).forEach((w) => { if (!w) return; out.push(/^\s+$/.test(w) ? ' ' : `<span class="w ${cls}">${w}</span>`); });
  });
  $('c' + i).innerHTML = out.join('') + (sub ? `<span class="sub">${sub}</span>` : '');
});
function capsAt(t) {
  AD.caps.forEach(([, , a, b, o], i) => {
    const el = $('c' + i); const out = eio(prog(t, b - .3, b));
    el.style.opacity = t < a || t > b ? 0 : 1 - out; el.style.transform = `translateY(${-40 * out}px)`;
    if (o && o.pov) { const p = back(prog(t, a, a + .4)); el.style.opacity = t < a || t > b ? 0 : Math.min(1, prog(t, a, a + .15)) * (1 - out); el.style.transform = `scale(${lerp(.6, 1, p)})`; return; }
    el.querySelectorAll('.w, .sub').forEach((w, j) => {
      const p = eo(prog(t, a + j * .06, a + j * .06 + .4));
      w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 60}px)`; w.style.filter = `blur(${(1 - p) * 12}px)`;
    });
  });
  $('capbg').style.opacity = AD.caps.some(([, , a, b, o]) => !(o && o.pov) && t >= a - .1 && t <= b) ? 1 : 0;
}

// ------------------------------------------------------------------ phone
function srcFor(e, t) { return e[1] === 'CALL' ? CALL[Math.floor(Math.max(0, t - e[0]) * 9) % CALL.length] : SH + e[1]; }
function screenAt(t) {
  const L = AD.screens; let k = 0; for (let i = 0; i < L.length; i++) if (t >= L[i][0]) k = i;
  const cur = L[k], prev = L[k - 1]; const f = prev ? prog(t, cur[0], cur[0] + .18) : 1;
  const A = $('sA'), B = $('sB'); const sb = srcFor(cur, t), sa = prev ? srcFor(prev, t) : sb;
  if (!B.src.endsWith(sb)) B.src = sb; if (!A.src.endsWith(sa)) A.src = sa;
  B.style.opacity = f;
  B.style.transform = prev && cur[1].startsWith('chat-') && prev[1].startsWith('chat-') ? `translateY(${(1 - eo(f)) * 14}px)` : 'none';
}
function camAt(t) {
  const C = AD.cam; let i = 0; while (i < C.length - 1 && t >= C[i + 1][0]) i++;
  const a = C[i], b = C[i + 1] || a; const x = b === a ? 1 : eio(prog(t, a[0], b[0]));
  const s = lerp(a[1], b[1], x), fx = lerp(a[2], b[2], x), fy = lerp(a[3], b[3], x);
  const ty = lerp(1150, 1260, clamp((s - 1) / .42)) - fy * s;
  const rise = (1 - eo(prog(t, AD.phone.rise, AD.phone.rise + .8))) * 1600, drop = eio(prog(t, AD.phone.drop, AD.phone.drop + .6)) * 1700;
  $('cam').style.display = t < AD.phone.rise || t > AD.phone.drop + .6 ? 'none' : 'block';
  $('cam').style.transform = `translate(${540 - fx * s}px,${ty + rise + drop}px) scale(${s})`;
  $('phone').style.transform = `rotate(${(1 - eo(prog(t, AD.phone.rise, AD.phone.rise + 1))) * -8}deg)`;
}
function tapAt(t) {
  const fin = $('fin'), rip = $('rip'); fin.style.opacity = 0; rip.style.opacity = 0;
  for (const [tt, x, y] of AD.taps) {
    const a = prog(t, tt - .5, tt), d = prog(t, tt, tt + .5);
    if (t > tt - .5 && t < tt + .55) {
      fin.style.opacity = t < tt ? eo(a) : 1 - d; fin.style.left = x - 43 + 'px'; fin.style.top = y - 43 + (1 - eo(a)) * 120 + 'px';
      fin.style.transform = `scale(${t < tt ? 1 - .15 * eo(a) : .85 + .15 * eo(prog(t, tt, tt + .2))})`;
    }
    if (t >= tt && t < tt + .55) { const r = 40 + 170 * eo(d); rip.style.opacity = 1 - d; rip.style.width = rip.style.height = 2 * r + 'px'; rip.style.left = x - r + 'px'; rip.style.top = y - r + 'px'; }
  }
}
function hlAt(t) {
  const el = $('hl'); el.style.opacity = 0;
  for (const [a, b, x, y, w, h] of AD.hl || []) if (t >= a && t <= b) {
    const p = eo(prog(t, a, a + .35)), o = 1 - prog(t, b - .2, b); const pad = 30 * (1 - p);
    el.style.opacity = p * o * (.75 + .25 * Math.sin(t * 8));
    Object.assign(el.style, { left: x - pad + 'px', top: y - pad + 'px', width: w + 2 * pad + 'px', height: h + 2 * pad + 'px' });
  }
}
$('chips').innerHTML = AD.chips.map(([txt, col], i) => `<div class="chip" id="ch${i}"><b style="background:${col}"></b>${txt}</div>`).join('');
function chipsAt(t) {
  AD.chips.forEach(([, , a, x, y], i) => {
    const el = $('ch' + i); const p = back(prog(t, a, a + .45)); const o = eio(prog(t, AD.chipsOut, AD.chipsOut + .35));
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.opacity = t < a ? 0 : prog(t, a, a + .2) * (1 - o);
    el.style.transform = `scale(${lerp(.4, 1, p)}) translateY(${Math.sin(t * 2 + a) * 8}px)`;
  });
}

// ------------------------------------------------------------------ counters (language)
function countersAt(t) {
  const c = AD.counters; const box = $('counters'); if (!c) return;
  const on = t >= c[0] && t <= c[1]; box.style.display = on ? 'flex' : 'none'; if (!on) return;
  const out = eio(prog(t, c[1] - .3, c[1])); box.style.opacity = 1 - out; box.style.filter = `blur(${out * 14}px)`;
  const p1 = eo(prog(t, .1, .45)), p2 = eo(prog(t, 1.7, 2.05));
  $('ct1').style.opacity = p1; $('ct1').style.transform = `translateY(${(1 - p1) * 80}px)`;
  $('ct2').style.opacity = p2; $('ct2').style.transform = `translateY(${(1 - p2) * 80}px) translateX(${t > 2.3 && t < 2.8 ? Math.sin(t * 90) * 22 * (1 - prog(t, 2.3, 2.8)) : 0}px)`;
  $('n1').textContent = Math.round(412 * eio(prog(t, .3, 1.6)));
}

// ------------------------------------------------------------------ world clocks (worldwide)
if (AD.clocks) $('clocks').innerHTML = AD.clocks[2].map(([fl, city, tm, ic, me], i) =>
  `<div class="clk${me ? ' me' : ''}" id="clk${i}"><span class="fl">${fl}</span><span class="city">${city}${me ? '<small>You, wide awake</small>' : ''}</span><span class="tm">${tm}</span><span class="ic">${ic}</span></div>`).join('');
function clocksAt(t) {
  const c = AD.clocks; if (!c) return; const [a, b] = c; const box = $('clocks');
  const on = t >= a && t <= b; box.style.display = on ? 'flex' : 'none'; if (!on) return;
  const out = eio(prog(t, b - .35, b)); box.style.opacity = 1 - out; box.style.transform = `translateY(${-100 * out}px)`;
  c[2].forEach((_, i) => { const p = eo(prog(t, a + .15 + i * .28, a + .6 + i * .28)); const el = $('clk' + i);
    el.style.opacity = p; el.style.transform = `translateX(${(1 - p) * (i % 2 ? 300 : -300)}px)`; });
}

// ------------------------------------------------------------------ roulette (animals)
const ORDER = ['lion', 'panda', 'owl', 'fox', 'dolphin', 'tiger', 'penguin', 'koala', 'wolf', 'rabbit', 'frog', 'eagle', 'bear', 'monkey', 'deer', 'elephant', 'turtle', 'horse', 'dog', 'cat'];
let lastAnimal = null;
function rouletteAt(t) {
  const r = AD.roulette; const el = $('roul'), bu = $('burst'); if (!r) return;
  const [a, land, end] = r; const on = t >= a && t <= end; el.style.display = on ? 'flex' : 'none'; bu.style.display = on && t >= land ? 'block' : 'none'; if (!on) return;
  // position along the list decelerates onto the last entry (the Cat) at `land`
  const idx = Math.min(ORDER.length - 1, Math.floor(eo(prog(t, a, land)) * (ORDER.length - 1) + .0001));
  const id = t >= land ? 'cat' : ORDER[idx];
  if (id !== lastAnimal) {
    lastAnimal = id; const A = TalkLiveAnimals.get(id);
    $('rIco').innerHTML = TalkLiveAnimals.icon(id, 400); $('rNm').textContent = A.name; $('rTr').textContent = t >= land ? A.trait : '';
  }
  const inP = back(prog(t, a, a + .45)), out = eio(prog(t, end - .3, end));
  const pop = t >= land ? 1 + .12 * Math.sin(Math.PI * prog(t, land, land + .35)) : 1;
  el.style.opacity = prog(t, a, a + .2) * (1 - out);
  el.style.transform = `scale(${lerp(.5, 1, inP) * pop}) translateY(${out * -120}px)`;
  el.style.boxShadow = t >= land ? `0 50px 120px rgba(0,0,0,.6), 0 0 ${120 * (1 - prog(t, land, end))}px rgba(167,139,250,.8)` : '0 50px 120px rgba(0,0,0,.6)';
  $('rIco').style.transform = t < land ? `translateY(${(1 - ((eo(prog(t, a, land)) * (ORDER.length - 1)) % 1)) * -30}px)` : 'none';
  const d = eo(prog(t, land, land + .8));
  bu.querySelectorAll('i').forEach((p, k) => {
    const ang = k / 18 * Math.PI * 2; const R = 120 + 520 * d;
    p.style.transform = `translate(${Math.cos(ang) * R}px,${Math.sin(ang) * R}px) scale(${1 - d})`; p.style.opacity = 1 - d;
  });
}
$('burst').innerHTML = Array.from({ length: 18 }, (_, k) => `<i style="background:${['#22d3ee', '#a78bfa', '#22c55e', '#fde047'][k % 4]}"></i>`).join('');

// ------------------------------------------------------------------ outro + background
$('tag').innerHTML = AD.tag;
function outroAt(t) {
  const on = t > OUTRO; $('outro').style.display = on ? 'flex' : 'none'; if (!on) return;
  const m = back(prog(t, OUTRO + .1, OUTRO + .6));
  $('mark').style.opacity = prog(t, OUTRO + .1, OUTRO + .3); $('mark').style.transform = `scale(${lerp(.3, 1, m)}) rotate(${(1 - m) * -20}deg)`;
  [['word', .4], ['tag', .7], ['cta', 1.1], ['fine', 1.4]].forEach(([id, d]) => {
    const p = eo(prog(t, OUTRO + d, OUTRO + d + .45)); $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * 60}px)`;
  });
  const pr = t > OUTRO + 1.6 ? ((t - OUTRO - 1.6) % 1.1) / 1.1 : 0;
  $('cta').style.boxShadow = `0 0 0 ${pr * 40}px rgba(34,197,94,${.55 * (1 - pr)}),0 20px 60px rgba(34,197,94,.35)`;
}
function bgAt(t) {
  $('g1').style.transform = `translate(${Math.sin(t * .5) * 120}px,${Math.cos(t * .4) * 90}px)`;
  $('g2').style.transform = `translate(${Math.cos(t * .45) * 110}px,${Math.sin(t * .35) * 120}px)`;
  $('g3').style.transform = `translate(${Math.sin(t * .3) * 160}px,${Math.cos(t * .55) * 140}px) scale(${1 + .15 * Math.sin(t)})`;
}

window.render = (t) => { bgAt(t); kinAt(t); countersAt(t); clocksAt(t); rouletteAt(t); camAt(t); screenAt(t); tapAt(t); hlAt(t); chipsAt(t); capsAt(t); outroAt(t); };
window.preload = async () => {
  TalkLiveAnimals.installSprite();
  const urls = [...new Set([...CALL, ...AD.screens.filter((s) => s[1] !== 'CALL').map((s) => SH + s[1]), $('mark').src])];
  for (const u of urls) { const i = new Image(); i.src = u; await new Promise((r) => { i.onload = i.onerror = r; }); }
  await document.fonts.load('800 80px PJS'); await document.fonts.load('600 40px PJS'); await document.fonts.ready;
};
render(0);
</script>
