<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkLive Email Signature</title>
<style>
  body { margin: 0; padding: 40px 16px; background: #f4f6fb; font-family: Arial, Helvetica, sans-serif; color: #0b0f1a; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e3e7f0; border-radius: 12px; padding: 24px; }
  .help { font-size: 13px; line-height: 1.6; color: #5a6275; margin-top: 20px; }
  .help b { color: #0b0f1a; }
  button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #1a63f5; color: #fff; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
<div class="card">

<!-- ===== SIGNATURE START (copy from here) ===== -->
<table id="sig" cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#1f2430;">
  <tr>
    <td valign="top" style="padding:0 24px 0 0;">
      <a href="https://talklive.app/" target="_blank" style="text-decoration:none;">
        <img src="https://talklive.app/email/talklive-mark.png" width="96" height="96" alt="TalkLive" style="display:block;width:96px;height:96px;border:0;">
      </a>
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;margin-top:12px;">
        <tr>
          <td style="padding:0 6px 0 0;"><a href="https://facebook.com/talklive.app" target="_blank"><img src="https://talklive.app/email/icon-facebook.png" width="24" height="24" alt="Facebook" style="display:block;width:24px;height:24px;border:0;"></a></td>
          <td style="padding:0 6px 0 0;"><a href="https://x.com/taklive.app" target="_blank"><img src="https://talklive.app/email/icon-x.png" width="24" height="24" alt="X" style="display:block;width:24px;height:24px;border:0;"></a></td>
          <td style="padding:0;"><a href="https://instagram.com/talklive.app" target="_blank"><img src="https://talklive.app/email/icon-instagram.png" width="24" height="24" alt="Instagram" style="display:block;width:24px;height:24px;border:0;"></a></td>
        </tr>
      </table>
    </td>
    <td valign="middle" style="padding:0;">
      <div style="font-size:16px;line-height:22px;color:#1f2430;padding-bottom:10px;border-bottom:1px solid #d5d9e2;min-width:150px;">TalkLive</div>
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;margin-top:10px;font-size:14px;line-height:20px;">
        <tr>
          <td valign="middle" style="padding:0 8px 6px 0;"><img src="https://talklive.app/email/icon-mail.png" width="20" height="20" alt="Email" style="display:block;width:20px;height:20px;border:0;"></td>
          <td valign="middle" style="padding:0 0 6px 0;"><a href="mailto:info@talklive.app" style="color:#1f2430;text-decoration:none;">info@talklive.app</a></td>
        </tr>
        <tr>
          <td valign="middle" style="padding:0 8px 0 0;"><img src="https://talklive.app/email/icon-globe.png" width="20" height="20" alt="Website" style="display:block;width:20px;height:20px;border:0;"></td>
          <td valign="middle" style="padding:0;"><a href="https://talklive.app/" target="_blank" style="color:#1f2430;text-decoration:none;">talklive.app</a></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<!-- ===== SIGNATURE END ===== -->

</div>
<button type="button" onclick="copySig()">Copy signature</button>
<div class="help">
  <b>Gmail:</b> Settings → See all settings → General → Signature → Create new → paste.<br>
  <b>Outlook:</b> Settings → Mail → Compose and reply → Email signature → paste.<br>
  <b>Apple Mail:</b> Settings → Signatures → + → paste (untick “Always match my default message font”).
</div>
</div>
<script>
function copySig() {
  var range = document.createRange();
  range.selectNode(document.getElementById('sig'));
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  try { document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges();
}
</script>
</body>
</html>
