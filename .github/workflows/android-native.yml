name: Android native app

# Builds an installable test APK of the native app (android-native/) on every
# push that touches it, or on demand: Actions > Android native app > Run
# workflow. Download "talklive-native-debug" from the run and install the APK
# on a phone. It installs next to the Play Store app (id app.talklive.debug).
on:
  workflow_dispatch:
  push:
    paths: ['android-native/**', 'server/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android-native/**', 'server/**', '.github/workflows/android-native.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The end-to-end tests run the real server locally.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Optional: Firebase config for push notifications. Must include both
      # app.talklive and app.talklive.debug (see android-native/README.md).
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > android-native/app/google-services.json

      - name: End-to-end tests (app against a local server)
        working-directory: android-native
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ServerE2ETest*' --tests '*GameRulesTest*'

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: android-native/app/build/reports/tests/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: talklive-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
