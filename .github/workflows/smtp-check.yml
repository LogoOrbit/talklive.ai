# Read-only: tries the live machine's SMTP settings and prints which ones can
# sign in. Never prints the password and sends no email.
name: SMTP check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Try SMTP sign-in on the live machine
        run: flyctl ssh console -a talklive-ai -C "node /app/scripts/smtp-check.js"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
