name: Android app

# Builds the signed Google Play bundle for the Capacitor app (mobile/) on
# demand: Actions > Android app > Run workflow, then download
# "talklive-android" from the run. Bump versionCode in
# mobile/android/app/build.gradle before each Play upload.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   GOOGLE_SERVICES_JSON       Firebase config for push (optional; without it
#                              the app works but has no push notifications)
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and sync Capacitor
        working-directory: mobile
        run: npm ci && npx cap sync android

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TALKLIVE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build bundle and APK
        working-directory: mobile/android
        env:
          TALKLIVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: talklive-android
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
