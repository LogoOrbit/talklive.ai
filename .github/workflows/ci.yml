name: CI

# Checks every pull request and every branch push before anything reaches
# main (which deploys straight to production - see fly-deploy.yml). The same
# checks run there too, but finding out on main is finding out in production.
# Changes only to the native Android app (built by android-native.yml) do not
# touch the website, so they skip these checks.
on:
  pull_request:
    paths-ignore: ['android-native/**', '.github/workflows/android-native.yml']
  push:
    branches-ignore:
      - main
    paths-ignore: ['android-native/**', '.github/workflows/android-native.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test and bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Zero errors required; warnings are cleanup notes.
      - name: Lint
        run: npm run lint

      - name: Build SEO pages
        run: npm run build:seo

      # Minified copies of the scripts, served only while they match the
      # source (server/minified.js). Must run after build:seo.
      - name: Minify scripts
        run: npm run build:min

      - name: Test compression and age assurance
        run: node --test scripts/test-compression.js scripts/test-age-assurance.js

      - name: Test traffic attribution
        run: npm run test:traffic

      - name: Test voice check
        run: npm run test:voice-gender

      - name: Test malformed socket packets cannot crash the server
        run: npm run test:malformed

      - name: Test store saves (durability and fast saves)
        run: npm run test:durability && npm run test:fast-save && npm run test:history

      # Auth, payments, friends, messaging and signalling, end to end against
      # a real server (scripts/run-tests.js). `npm test` runs every suite.
      - name: Critical tests
        run: npm run test:critical

      - name: Audit generated SEO
        run: npm run audit:seo

      # Fails the PR if a page's initial JS, CSS or HTML outgrows
      # scripts/bundle-budget.json.
      - name: Bundle size budget
        run: npm run check:bundle
