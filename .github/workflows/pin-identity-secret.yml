# Copies the identity secret the server already uses (stored in the data
# store as secrets.identity) into the Fly secret IDENTITY_SECRET, so it
# survives even a restore from an older backup. Never generates a new value:
# a different secret would invalidate every browser's identity token and cut
# users off from their friends and chats.
#
# Run from the Actions tab. The value is masked and never printed. Does
# not change IDENTITY_SECRET if it is already set; it still checks it.
name: Pin identity secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Skip if already set
        id: check
        run: |
          if flyctl secrets list -a talklive-ai | awk '{print $1}' | grep -qx IDENTITY_SECRET; then
            echo "IDENTITY_SECRET is already set; nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the stored secret and set it
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          V=$(flyctl ssh console -a talklive-ai -C "node /app/scripts/identity-secret.js print" 2>/dev/null | tr -d '\r\n ')
          echo "::add-mask::$V"
          if ! printf '%s' "$V" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "Stored secret not found or not 64 hex characters. Nothing changed."
            exit 1
          fi
          printf 'IDENTITY_SECRET=%s\n' "$V" | flyctl secrets import -a talklive-ai
          echo "IDENTITY_SECRET set from the stored value."

      - name: Confirm the running server uses the same value
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outputs.skip }}" != "1" ]; then sleep 45; fi
          R=$(flyctl ssh console -a talklive-ai -C "node /app/scripts/identity-secret.js check" 2>/dev/null | tr -d '\r\n ')
          echo "Result: $R"
          if [ "$R" != "match" ]; then
            echo "Values differ. Run: flyctl secrets unset IDENTITY_SECRET -a talklive-ai"
            exit 1
          fi
