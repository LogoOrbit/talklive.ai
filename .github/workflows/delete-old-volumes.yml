# One-off: delete data volumes left behind outside primary_region (the iad
# volume kept as a backup by move-region.yml on 2026-10-01). Unattached
# volumes are still billed, and the store lives in Postgres anyway.
#
# Only volumes that are not attached to any machine and are not in the
# primary region are touched. Run with dry_run first to see the list.
name: Delete old volumes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: talklive-ai
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Delete unattached volumes outside the primary region
        run: |
          set -euo pipefail
          REGION=$(sed -n "s/^primary_region = '\(.*\)'/\1/p" fly.toml)
          [ -n "$REGION" ] || { echo "No primary_region in fly.toml"; exit 1; }
          flyctl volumes list -a "$APP"
          OLD=$(flyctl volumes list -a "$APP" --json | jq -r --arg r "$REGION" \
            '.[] | select(.region != $r and ((.attached_machine_id // "") == "")) | .id')
          if [ -z "$OLD" ]; then echo "Nothing to delete."; exit 0; fi
          for id in $OLD; do
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "would delete $id"
            else
              flyctl volumes destroy "$id" -a "$APP" -y
            fi
          done
          flyctl volumes list -a "$APP"
