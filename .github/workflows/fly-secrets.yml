# Copies server keys from GitHub secrets to the Fly app, so they can be added
# from the browser: put the key in Settings > Secrets and variables > Actions,
# then run this workflow from the Actions tab. Only secrets that are set are
# copied; the app restarts once with the new values.
#   FCM_SERVICE_ACCOUNT   Firebase service-account JSON (push notifications)
#   PLAY_SERVICE_ACCOUNT  Google Play service-account JSON (Plus subscriptions)
#   PLAY_RTDN_SECRET      any random string (Play renewal notifications)
name: Copy server keys to Fly

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set the secrets that exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          PLAY_RTDN_SECRET: ${{ secrets.PLAY_RTDN_SECRET }}
        run: |
          args=()
          # Base64, so a multi-line JSON key survives as one value (the server accepts both).
          [ -n "$FCM_SERVICE_ACCOUNT" ] && args+=("FCM_SERVICE_ACCOUNT=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | base64 -w0)")
          [ -n "$PLAY_SERVICE_ACCOUNT" ] && args+=("PLAY_SERVICE_ACCOUNT=$(printf '%s' "$PLAY_SERVICE_ACCOUNT" | base64 -w0)")
          [ -n "$PLAY_RTDN_SECRET" ] && args+=("PLAY_RTDN_SECRET=$PLAY_RTDN_SECRET")
          if [ ${#args[@]} -eq 0 ]; then echo "::warning::No keys set in GitHub secrets yet."; exit 0; fi
          flyctl secrets set -a talklive-ai "${args[@]}"
          echo "Copied ${#args[@]} key(s) to Fly."
