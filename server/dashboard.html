/* ---------- chats: conversation reader ----------
   Chat used to render as one flat, newest-first feed of every message from
   every pair. That is unreadable for the job it exists for - judging whether
   conversations on the app are healthy - because consecutive lines almost never
   belong to the same conversation.

   So: the server folds the store into conversations and scores each one, this
   picks one to read, and the thread renders as a real transcript. The list
   carries enough (who, how long, what was said last, what tripped a flag) to
   skip a conversation without opening it, which is where the time actually
   goes. j/k move, Enter opens, Esc goes back, so a review pass never needs
   the mouse. */
let chatQuery='',chatKind='',chatFlagged=false,chatSort='recent',chatOpen=null,chatRows=[],chatCursor=-1;

const FLAG_LABEL={minor:'age',sexual:'sexual',contact:'contact',link:'link',money:'money',abuse:'abuse'};
const flagChips=(flags)=>(flags||[]).map(f=>`<span class="fl ${f}">${FLAG_LABEL[f]||esc(f)}</span>`).join('');

const clock=(ts)=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

/* "4m", "1h 12m" - how long the pair actually talked, which separates a real
   conversation from two people saying hi and leaving. */
function span(ms){
  const m=Math.round(ms/60000);
  if(m<1)return'<1m';
  if(m<60)return m+'m';
  return Math.floor(m/60)+'h '+(m%60)+'m';
}

function convRow(c,i){
  const names=c.people.map(p=>esc(p.name)).join(' <span class="muted">&#8596;</span> ')||'unknown';
  return `<button class="cvrow${c.pair===chatOpen?' on':''}" data-pair="${esc(c.pair)}" data-i="${i}">
    <span class="who">${names}
      ${c.kind==='friend'?'<span class="pill info">Friends</span>':'<span class="pill warn">Stranger</span>'}
      ${c.oneSided?'<span class="pill crit">One-sided</span>':''}</span>
    <span class="prev">${esc(c.preview)||'<span class="muted">(no text)</span>'}</span>
    <span class="meta"><span>${num(c.count)} msg</span><span>${span(c.end-c.start)}</span><span>${ago(c.end)}</span>${c.country?`<span>${esc(c.country)}</span>`:''}</span>
    ${c.flags.length?`<span class="cvflags">${flagChips(c.flags)}</span>`:''}
  </button>`;
}

async function viewChats(){
  const params=new URLSearchParams();
  if(chatQuery)params.set('q',chatQuery);
  if(chatKind)params.set('kind',chatKind);
  if(chatFlagged)params.set('flagged','1');
  if(chatSort!=='recent')params.set('sort',chatSort);
  const qs=params.toString();
  const r=await api('transcripts'+(qs?'?'+qs:''));
  chatRows=r.conversations||[];
  /* A conversation that fell out of the current filter must not stay selected -
     the thread pane would keep showing something the list no longer offers. */
  if(chatOpen&&!chatRows.some(c=>c.pair===chatOpen))chatOpen=null;
  chatCursor=chatRows.findIndex(c=>c.pair===chatOpen);

  const flagged=chatRows.filter(c=>c.flags.length).length;
  $('#main').innerHTML=`<div class="card anim" style="margin-top:0">
  <h2>&#128172; Conversations <span class="sub">${num(r.matched||chatRows.length)} threads &middot; ${num(r.total)} messages stored &middot; text only, voice is peer-to-peer and never recorded</span></h2>
  <div class="searchbar">
    <input id="chatQ" placeholder="Search by username, ID or message text&hellip;" value="${esc(chatQuery)}">
    <button class="btn" id="chatQBtn">Search</button>
  </div>
  <div class="tbar">
    <div class="seg">
      <button data-ck="" class="${chatKind===''?'on':''}">All</button>
      <button data-ck="stranger" class="${chatKind==='stranger'?'on':''}">Strangers</button>
      <button data-ck="friend" class="${chatKind==='friend'?'on':''}">Friends</button>
    </div>
    <div class="seg">
      <button data-cs="recent" class="${chatSort==='recent'?'on':''}">Recent</button>
      <button data-cs="longest" class="${chatSort==='longest'?'on':''}">Longest</button>
      <button data-cs="risk" class="${chatSort==='risk'?'on':''}">Needs review</button>
    </div>
    <div class="seg"><button id="chatFlagBtn" class="${chatFlagged?'on':''}">&#9873; Flagged only (${num(flagged)})</button></div>
  </div>
  <div class="cvwrap${chatOpen?' reading':''}" id="cvwrap">
    <div class="cvlist" id="cvlist">
      ${chatRows.map(convRow).join('')||'<div class="cvempty">No conversations match. Clear the filters, or wait for people to talk.</div>'}
    </div>
    <div class="cvthread" id="cvthread"><div class="cvempty">Pick a conversation to read it.<br><span class="muted">j / k to move, Enter to open, Esc to come back.</span></div></div>
  </div></div>`;

  const go=()=>{chatQuery=$('#chatQ').value.trim();chatOpen=null;load();};
  $('#chatQBtn').onclick=go;
  $('#chatQ').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{chatKind=b.dataset.ck;chatOpen=null;load();});
  document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{chatSort=b.dataset.cs;load();});
  $('#chatFlagBtn').onclick=()=>{chatFlagged=!chatFlagged;chatOpen=null;load();};
  /* One listener for the whole list rather than one per row. */
  $('#cvlist').addEventListener('click',e=>{
    const row=e.target.closest('.cvrow');
    if(row)openConversation(row.dataset.pair,Number(row.dataset.i));
  });
  if(chatOpen)openConversation(chatOpen,chatCursor);
}

/* Fetches and renders one thread. Deliberately does NOT call load(): re-running
   the whole tab to open a conversation would refetch the list and throw away
   the reader's scroll position on every click. */
async function openConversation(pair,i){
  chatOpen=pair;
  if(typeof i==='number'&&i>=0)chatCursor=i;
  document.querySelectorAll('.cvrow').forEach(b=>b.classList.toggle('on',b.dataset.pair===pair));
  const wrap=$('#cvwrap'),pane=$('#cvthread');
  if(!pane)return;
  wrap.classList.add('reading');
  pane.innerHTML='<div class="cvempty">Loading&hellip;</div>';
  let c;
  try{
    const r=await api('transcripts?pair='+encodeURIComponent(pair));
    c=r.conversation;
  }catch(e){
    pane.innerHTML=`<div class="cvempty">Could not load this conversation.<br><span class="muted">${esc(e.message)}</span></div>`;
    return;
  }
  /* The transcript has no "me", so sides are assigned by who spoke first and
     held for the whole thread - otherwise the bubbles would swap sides between
     renders and the thread would be unreadable. */
  const order=[];
  for(const m of c.messages){if(m.fromClientId&&order.indexOf(m.fromClientId)===-1)order.push(m.fromClientId);}
  const sideOf=(id)=>order.indexOf(id)===1?'b':'a';
  const byId={};
  for(const m of c.messages)if(m.id)byId[m.id]=m;

  let lastFrom=null,lastTs=0;
  const body=c.messages.map(m=>{
    const side=sideOf(m.fromClientId);
    let out='';
    /* A gap longer than five minutes is usually a different sitting; marking it
       stops two separate exchanges reading as one. */
    if(lastTs&&m.ts-lastTs>300000)out+=`<div class="cvgap">- ${span(m.ts-lastTs)} later -</div>`;
    if(m.fromClientId!==lastFrom)out+=`<div class="cvname ${side}">${esc(m.from)}</div>`;
    lastFrom=m.fromClientId;lastTs=m.ts;
    const q=m.replyTo&&byId[m.replyTo]?`<span class="q">&#8618; ${esc(String(byId[m.replyTo].text||'').slice(0,90))}</span>`:'';
    /* Clock time only on the bubble - a transcript is read as one sitting, so
       repeating the date on every line is pure noise. The full stamp stays on
       the title, and the thread header carries the date. */
    return out+`<div class="cvb ${side}${m.flags.length?' risk':''}">${q}${esc(m.text)}
      ${m.flags.length?`<span class="cvflags">${flagChips(m.flags)}</span>`:''}
      <span class="t" title="${esc(fmtTs(m.ts))}">${clock(m.ts)}</span></div>`;
  }).join('');

  const bans=c.people.map(p=>`<button class="danger" onclick="banUser('${jsq(p.clientId)}','','${jsq(p.name)}','${jsq(c.country||'')}','')">Ban ${esc(p.name)}&hellip;</button>`).join('');
  pane.innerHTML=`<div class="cvthead">
    <button class="cvback" id="cvBack">&#8592; List</button>
    <h3>${c.people.map(p=>esc(p.name)).join(' &#8596; ')}
      <span class="sub">${num(c.count)} messages &middot; ${span(c.end-c.start)} &middot; ${fmtTs(c.end)} (${ago(c.end)})${c.country?' &middot; '+esc(c.country):''} &middot; ${c.kind==='friend'?'friends':'strangers'}</span></h3>
    <div class="rowbtns">${bans}</div>
  </div>
  <div class="cvbody">${body||'<div class="cvempty">No messages.</div>'}</div>`;
  const back=$('#cvBack');
  if(back)back.onclick=closeConversation;
  /* Newest at the bottom, like every chat app - so the pane opens where the
     conversation ended. */
  pane.scrollTop=pane.scrollHeight;
}

function closeConversation(){
  chatOpen=null;
  const wrap=$('#cvwrap');
  if(wrap)wrap.classList.remove('reading');
  document.querySelectorAll('.cvrow').forEach(b=>b.classList.remove('on'));
}

/* Keyboard review pass. Only live while the Chats tab is showing and the
   operator is not typing into the search box. */
document.addEventListener('keydown',(e)=>{
  if(tab!=='chats')return;
  const el=document.activeElement;
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable))return;
  if(e.key==='Escape'){closeConversation();return;}
  if(e.key!=='j'&&e.key!=='k'&&e.key!=='Enter')return;
  if(!chatRows.length)return;
  e.preventDefault();
  if(e.key==='Enter'){
    if(chatCursor>=0)openConversation(chatRows[chatCursor].pair,chatCursor);
    return;
  }
  chatCursor=Math.max(0,Math.min(chatRows.length-1,chatCursor+(e.key==='j'?1:-1)));
  const row=document.querySelector(`.cvrow[data-i="${chatCursor}"]`);
  if(row){
    row.scrollIntoView({block:'nearest'});
    /* On a wide screen both panes are visible, so moving the cursor may as well
       load the thread; on a narrow one that would hide the list mid-scroll. */
    if(window.innerWidth>1000)openConversation(chatRows[chatCursor].pair,chatCursor);
    else document.querySelectorAll('.cvrow').forEach(b=>b.classList.toggle('on',b===row));
  }
});

let accCountryAll=false,accQ='',accSort='createdAt',accDir=-1;
const ACC_COLS=[['username','Username'],['nickname','Nickname'],['method','Sign-up method'],['email','Email'],['country','Location'],['createdAt','Created'],['lastSeen','Last seen'],['ip','IP']];
/* usernameLower of the account whose full shared profile is expanded, if any. */
let accOpen='';
/* Everything Google handed us for one account, shown only when the row is
   expanded - the table stays readable, and the complete record is one click
   away instead of living in a CSV. */
function accProfileRow(a){
  const g=a.google;
  const fields=[
    ['Full name',g&&g.name],
    ['First name',g&&g.givenName],
    ['Last name',g&&g.familyName],
    ['Google email',g&&g.email],
    ['Email verified',g?(g.emailVerified?'Yes':'No'):null],
    ['Google ID',g&&g.id],
    ['Locale',g&&g.locale],
    ['Workspace domain',g&&g.hostedDomain],
    ['Linked',g&&g.linkedAt?fmtTs(g.linkedAt):null],
    ['Last Google sign-in',g&&g.lastSignInAt?fmtTs(g.lastSignInAt):null],
    ['Country',a.country],['City',a.city],['IP',a.ip],
    ['Account created',a.createdAt?fmtTs(a.createdAt):null],
    ['Last seen',a.lastSeen?fmtTs(a.lastSeen):null],
  ].filter(([,v])=>v!==null&&v!==undefined&&v!=='');
  return `<tr class="accdetail"><td colspan="${ACC_COLS.length+1}">
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:6px 2px">
      ${g&&g.picture?`<img src="${esc(g.picture)}" alt="" referrerpolicy="no-referrer" style="width:64px;height:64px;border-radius:50%;flex:0 0 auto">`:''}
      <div style="flex:1;min-width:240px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.82rem">
        ${fields.map(([k,v])=>`<div class="muted">${esc(k)}</div><div>${esc(String(v))}</div>`).join('')}
      </div>
    </div>
    ${g?'<div class="muted" style="font-size:.75rem">Shared by the user through Google Sign-In consent.</div>'
       :'<div class="muted" style="font-size:.75rem">Password account - no Google profile shared.</div>'}
  </td></tr>`;
}
function accSortTh(){
  return ACC_COLS.map(([k,l])=>`<th class="sortable" data-s="${k}">${l} <span class="ar">${accSort===k?(accDir<0?'▼':'▲'):'↕'}</span></th>`).join('');
}
async function viewAccounts(){
  const r=await api('accounts');
  const all=r.accounts||[];

  /* Country split is computed over every account, not just the filtered rows -
     the chart is about the whole audience. */
  const byCountry={};
  for(const a of all){
    const c=String(a.country||'').trim()||'Unknown';
    byCountry[c]=(byCountry[c]||0)+1;
  }
  const ranked=Object.entries(byCountry).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const total=all.length;
  const shown=accCountryAll?ranked:ranked.slice(0,12);
  const max=Math.max(1,...ranked.map(e=>e[1]));
  const palette=['var(--s1)','var(--s2)','var(--s3)','var(--s5)','var(--accent)','var(--serious)'];
  const google=all.filter(a=>a.method==='google').length;
  const withEmail=all.filter(a=>a.email).length;
  const verified=all.filter(a=>a.google&&a.google.emailVerified).length;
  const DAY=86400000,now=Date.now();
  const newWeek=all.filter(a=>a.createdAt&&now-a.createdAt<7*DAY).length;
  const active7=all.filter(a=>a.lastSeen&&now-a.lastSeen<7*DAY).length;

  const q=accQ.trim().toLowerCase();
  let rows=q?all.filter(a=>[a.username,a.key,a.nickname,a.country,a.city,a.ip,a.email,
    a.google&&a.google.name,a.google&&a.google.hostedDomain,a.google&&a.google.id]
    .some(v=>String(v||'').toLowerCase().includes(q))):all.slice();
  rows.sort((a,b)=>{
    const va=a[accSort],vb=b[accSort];
    if(typeof va==='number'||typeof vb==='number')return ((va||0)-(vb||0))*accDir;
    return String(va||'').localeCompare(String(vb||''))*accDir;
  });

  $('#main').innerHTML=`<div class="grid tiles anim" style="margin-top:0">
    <div class="tile"><div class="k">Accounts</div><div class="v grad" data-count="${total}">0</div><div class="s">registered users</div></div>
    <div class="tile"><div class="k">Countries</div><div class="v" data-count="${ranked.filter(([c])=>c!=='Unknown').length}">0</div><div class="s">distinct countries</div></div>
    <div class="tile"><div class="k">New this week</div><div class="v" data-count="${newWeek}">0</div><div class="s">signed up in 7 days</div></div>
    <div class="tile"><div class="k">Active this week</div><div class="v" data-count="${active7}">0</div><div class="s">${pctOf(active7,total)} of all accounts</div></div>
    <div class="tile"><div class="k">Top country</div><div class="v" style="font-size:1.15rem">${ranked.length?esc(ranked[0][0]):'-'}</div><div class="s">${ranked.length?num(ranked[0][1])+' accounts · '+pctOf(ranked[0][1],total):'no data'}</div></div>
    <div class="tile"><div class="k">Sign-up method</div><div class="v" style="font-size:1.15rem">${num(google)} / ${num(total-google)}</div><div class="s">Google / password</div></div>
    <div class="tile"><div class="k">Emails on file</div><div class="v" data-count="${withEmail}">0</div><div class="s">${num(verified)} verified by Google</div></div>
  </div>
  <div class="card anim"><h2>\u{1F30D} Accounts by country <span class="sub">${ranked.length} ${ranked.length===1?'country':'countries'} · ${num(total)} accounts</span>
  <span style="margin-left:auto;display:flex;gap:8px">${exportLink('countries','Country CSV')}
  ${ranked.length>12?`<button class="lnk" id="accCountryToggle">${accCountryAll?'Show top 12':'Show all '+ranked.length}</button>`:''}</span></h2>
  ${shown.map(([c,v],i)=>`<div class="crow">
    <div class="rk">${i+1}</div>
    <div class="cname" title="${esc(c)}">${esc(c)}</div>
    <div><div class="cbar" style="width:${Math.max(2,v/max*100)}%;background:${palette[i%palette.length]}"></div></div>
    <div class="cn"><b>${num(v)}</b> <span class="muted">${pctOf(v,total)}</span></div>
  </div>`).join('')||'<div class="muted">No accounts registered yet.</div>'}
  </div>
  <div class="card anim"><h2>\u{1F464} Registered accounts <span class="sub">${q?rows.length+' of '+total+' shown':num(total)+' total'} · click a heading to sort</span></h2>
  <div class="tbar">
    <input id="accQ" class="grow" placeholder="Search username, nickname, country, IP…" value="${esc(accQ)}">
    ${accQ?'<button class="lnk" id="accClear">Clear</button>':''}
    ${exportLink('accounts','Export accounts')}
  </div>
  <table><tr>${accSortTh()}<th></th></tr>
  ${rows.map(a=>`<tr><td><b>${esc(a.username||a.key)}</b></td><td>${esc(a.google&&a.google.name||a.nickname||'')}</td>
  <td>${a.method==='google'?'<span class="pill info">Google</span>':'<span class="pill good">Password</span>'}</td>
  <td>${a.email?esc(a.email)+(a.google&&a.google.emailVerified?' <span class="pill good">verified</span>':''):'<span class="muted">-</span>'}</td>
  <td>${esc(a.country||'')}${a.city&&a.city!=='Unknown'?', '+esc(a.city):''}</td>
  <td>${a.createdAt?fmtTs(a.createdAt):'-'}</td><td>${a.lastSeen?ago(a.lastSeen):'-'}</td><td class="muted">${esc(a.ip||'')}</td>
  <td><button class="lnk accToggle" data-k="${esc(a.key)}">${accOpen===a.key?'Hide':'Details'}</button></td></tr>
  ${accOpen===a.key?accProfileRow(a):''}`).join('')||`<tr><td colspan="${ACC_COLS.length+1}" class="muted">${q?'No account matches that search.':'No accounts registered yet.'}</td></tr>`}</table></div>`;
  animateCounters();
  const tg=$('#accCountryToggle');
  if(tg)tg.onclick=()=>{accCountryAll=!accCountryAll;viewAccounts();};
  document.querySelectorAll('.accToggle').forEach(b=>b.onclick=()=>{
    accOpen=accOpen===b.dataset.k?'':b.dataset.k;
    viewAccounts();
  });
  const inp=$('#accQ');
  onFilterInput(inp,(v)=>{accQ=v;},()=>viewAccounts().then(()=>keepFocus('#accQ')));
  const cl=$('#accClear');if(cl)cl.onclick=()=>{accQ='';viewAccounts();};
  document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.s;
    if(accSort===k)accDir=-accDir; else {accSort=k;accDir=(k==='createdAt'||k==='lastSeen')?-1:1;}
    viewAccounts();
  });
}

/* ---------- revenue: subscriptions, referrals, push reach ---------- */
async function viewRevenue(){
  const [r,ads]=await Promise.all([api('premium'),api('adsterra').catch(e=>({configured:true,error:e.message}))]);
  const t=r.totals,ref=r.referrals;
  const act=r.activations.slice(-14);
  const actMax=Math.max(1,...act.map(d=>Math.max(d.activated,d.cancelled)));
  const srcColor={stripe:'var(--good)',referral:'var(--s1)',client:'var(--s3)',unknown:'var(--muted)'};
  const expiringSoon=r.rows.filter(x=>x.status==='active'&&x.expiresAt&&x.expiresAt-Date.now()<7*86400000);
  $('#main').innerHTML=adsterraSection(ads)+`<div class="grid tiles anim">
    <div class="tile"><div class="k">💎 Active Plus</div><div class="v grad" data-count="${t.active}">0</div><div class="s">${num(t.paying)} paying · ${num(t.permanent)} permanent</div></div>
    <div class="tile"><div class="k">Expiring in 7 days</div><div class="v" style="color:${t.expiringIn7Days?'var(--warn)':'inherit'}" data-count="${t.expiringIn7Days}">0</div><div class="s">renew or lapse</div></div>
    <div class="tile"><div class="k">Lapsed</div><div class="v" data-count="${t.expired}">0</div><div class="s">${num(t.revoked)} cancelled</div></div>
    <div class="tile"><div class="k">Conversion</div><div class="v">${pctOf(t.active,r.accounts||0)}</div><div class="s">of ${num(r.accounts||0)} accounts</div></div>
    <div class="tile"><div class="k">Referral signups</div><div class="v" data-count="${ref.joined}">0</div><div class="s">${num(ref.qualified)} qualified · ${num(ref.pendingClaims)} pending</div></div>
    <div class="tile"><div class="k">Push reach</div><div class="v" data-count="${r.push.subscribers}">0</div><div class="s">${num(r.push.endpoints)} devices subscribed</div></div>
  </div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="card anim"><h2>📈 Plus activity <span class="sub">last 14 days</span></h2>
      <div class="legend"><span><i style="background:var(--good)"></i>Activated</span><span><i style="background:var(--crit)"></i>Cancelled</span></div>
      ${act.map(d=>`<div class="hrow"><div>${esc(d.day.slice(5))}</div>
        <div style="display:flex;gap:3px;flex-direction:column">
          <div class="hbar" style="width:${d.activated?Math.max(3,d.activated/actMax*100):0}%;background:var(--good);height:9px"></div>
          <div class="hbar" style="width:${d.cancelled?Math.max(3,d.cancelled/actMax*100):0}%;background:var(--crit);height:9px"></div>
        </div><div class="n">+${num(d.activated)} / -${num(d.cancelled)}</div></div>`).join('')||'<div class="muted">No subscription events recorded yet.</div>'}
    </div>
    <div class="card anim"><h2>🏷️ Where Plus comes from <span class="sub">active grants by source</span></h2>
      ${r.bySource.map(([src,n])=>`<div class="hrow"><div>${esc(src)}</div><div><div class="hbar" style="width:${Math.max(2,n/Math.max(1,t.active)*100)}%;background:${srcColor[src]||'var(--s5)'}"></div></div><div class="n">${num(n)}</div></div>`).join('')||'<div class="muted">Nobody is on Plus yet.</div>'}
      <div class="muted" style="margin-top:10px">stripe = paid · referral = invite reward · client = granted for testing or support</div>
    </div>
  </div>

  ${expiringSoon.length?`<div class="card anim"><h2>⏳ Lapsing within 7 days <span class="sub">${expiringSoon.length} subscriber(s)</span></h2>
  <table><tr><th>Client</th><th>Source</th><th>Expires</th><th>Last event</th></tr>
  ${expiringSoon.slice(0,25).map(x=>`<tr><td class="muted">${esc(x.clientId.slice(0,16))}…</td><td>${esc(x.source)}</td><td>${fmtTs(x.expiresAt)}</td><td class="muted">${esc(x.lastEvent||'')}</td></tr>`).join('')}</table></div>`:''}

  <div class="card anim"><h2>🎁 Top referrers <span class="sub">${num(ref.codes)} codes issued · ${num(ref.rewardedDays)} reward days paid out</span></h2>
  <table><tr><th>Code</th><th>Client</th><th class="num">Invited</th><th class="num">Qualified</th><th class="num">Reward days</th><th>Since</th></tr>
  ${ref.top.map(o=>`<tr><td><b>${esc(o.code)}</b></td><td class="muted">${esc(o.clientId.slice(0,14))}…</td>
  <td class="num">${num(o.joined)}</td><td class="num">${num(o.qualified)}</td><td class="num">${num(o.rewardedDays)}</td>

  ${r.rows.slice(0,200).map(x=>`<tr style="${x.status==='active'?'':'opacity:.6'}"><td class="muted">${esc(x.clientId.slice(0,16))}…</td>
  <td>${x.status==='active'?`<span class="pill good">Active${x.permanent?' · permanent':''}</span>`:x.status==='expired'?'<span class="pill warn">Lapsed</span>':'<span class="pill crit">Cancelled</span>'}</td>
  <td>${esc(x.source)}${x.paying?' <span class="pill info">paid</span>':''}</td>

  <td>${x.expiresAt?fmtTs(x.expiresAt):x.status==='active'?'<span class="muted">never</span>':'-'}</td>
  <td class="muted">${esc(x.lastEvent||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No subscriptions yet. Once Stripe checkout or a referral reward runs, it shows up here.</td></tr>'}</table></div>`;
  animateCounters();
}

/* Adsterra ad earnings, fetched server-side with ADSTERRA_API_KEY. */
const usd=v=>'$'+(Number(v)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function adsterraSection(a){
  if(!a||!a.configured)return `<div class="card anim" style="margin-top:0"><h2>📢 Ad revenue <span class="sub">Adsterra</span></h2>
    <div class="muted">Not connected. Copy your API token from Adsterra → Profile → API, then run <code>fly secrets set ADSTERRA_API_KEY='...'</code>.</div></div>`;
  if(a.error)return `<div class="card anim" style="margin-top:0"><h2>📢 Ad revenue <span class="sub">Adsterra</span></h2>
    <div class="muted">Could not load Adsterra stats: ${esc(a.error)}</div></div>`;
  const t=a.totals,days=a.daily.slice(-30),max=Math.max(0.01,...days.map(d=>d.revenue));
  const table=(rows,label)=>`<table><tr><th>${label}</th><th class="num">Revenue</th><th class="num">Impressions</th><th class="num">CPM</th><th class="num">CTR</th></tr>
    ${rows.map(x=>`<tr><td>${esc(x.key)}</td><td class="num"><b>${usd(x.revenue)}</b></td><td class="num">${num(x.impressions)}</td><td class="num">${usd(x.cpm)}</td><td class="num">${x.ctr}%</td></tr>`).join('')||`<tr><td colspan="5" class="muted">No data yet.</td></tr>`}</table>`;
  return `<div class="grid tiles anim" style="margin-top:0">
    <div class="tile"><div class="k">📢 Ads today</div><div class="v grad">${usd(t.today.revenue)}</div><div class="s">${num(t.today.impressions)} impressions · UTC day</div></div>
    <div class="tile"><div class="k">Yesterday</div><div class="v">${usd(t.yesterday.revenue)}</div><div class="s">CPM ${usd(t.yesterday.cpm)}</div></div>
    <div class="tile"><div class="k">Last 7 days</div><div class="v">${usd(t.last7.revenue)}</div><div class="s">${num(t.last7.impressions)} impressions</div></div>
    <div class="tile"><div class="k">This month</div><div class="v">${usd(t.monthToDate.revenue)}</div><div class="s">CPM ${usd(t.monthToDate.cpm)}</div></div>
    <div class="tile"><div class="k">Last 30 days</div><div class="v">${usd(t.last30.revenue)}</div><div class="s">CTR ${t.last30.ctr}% · CPM ${usd(t.last30.cpm)}</div></div>
    <div class="tile"><div class="k">💰 All time</div>${t.allTime.error?`<div class="v">-</div><div class="s">${esc(t.allTime.error)}</div>`:`<div class="v grad">${usd(t.allTime.revenue)}</div><div class="s">${usd(t.allTime.settled)} excl. today (matches Adsterra balance)${t.allTime.since?' · since '+esc(t.allTime.since):''}</div>`}</div>
  </div>
  <div class="card anim"><h2>📢 Ad revenue by day <span class="sub">Adsterra · last 30 days · refreshed every 10 min</span></h2>
    ${days.slice().reverse().map(d=>`<div class="hrow"><div>${esc(d.key.slice(5))}</div><div><div class="hbar" style="width:${d.revenue?Math.max(2,d.revenue/max*100):0}%;background:var(--good)"></div></div><div class="n">${usd(d.revenue)}</div></div>`).join('')}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="card anim"><h2>🧩 By ad unit <span class="sub">last 31 days</span></h2>${table(a.placements,'Placement')}</div>
    <div class="card anim"><h2>🌍 By country <span class="sub">last 31 days</span></h2>${table(a.countries,'Country')}</div>
  </div>`;
}

async function viewErrors(){
  const r=await api('errors');
  $('#main').innerHTML=`<div class="card anim" style="margin-top:0"><h2>🐛 Bugs &amp; errors <span class="sub">client + server, duplicates collapsed</span>
  ${r.errors.length?`<button id="clearErrs" style="margin-left:auto;border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);background:var(--surface-2);color:var(--crit);border-radius:9px;padding:6px 12px;font-size:.78rem">Clear all</button>`:''}</h2>
  <div class="muted" style="margin-bottom:10px">Records never expire on their own. Dismiss one after shipping a fix - if it comes back, it wasn't fixed.</div>
  <table><tr><th>Last seen</th><th>Source</th><th>Error</th><th class="num">Count</th><th>User</th><th></th></tr>
  ${r.errors.map(e=>`<tr><td>${ago(e.ts)}</td><td><span class="pill ${e.source==='server'?'crit':'warn'}">${esc(e.source)}</span></td>
  <td><b>${esc(e.message)}</b>${e.url?`<br><span class="muted">${esc(e.url)}</span>`:''}${e.stack?`<details><summary class="muted" style="cursor:pointer">stack</summary><pre style="font-size:.7rem;white-space:pre-wrap;color:var(--ink2)">${esc(e.stack)}</pre></details>`:''}</td>
  <td class="num">${num(e.count)}</td><td>${esc(e.username||'')}${e.country?`<br><span class="muted">${esc(e.country)}</span>`:''}</td>
  <td class="rowbtns"><button onclick="dismissError('${jsq(e.id)}')">Dismiss</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No errors logged. 🎉</td></tr>'}</table></div>`;
  const cb=$('#clearErrs');
  if(cb)cb.onclick=async()=>{if(confirm('Clear every error record?')){await post('errors/dismiss',{all:true});load();}};
}
window.dismissError=async(id)=>{try{await post('errors/dismiss',{id});toast('Error dismissed','If it happens again it comes straight back.');load();}catch(e){toast('Could not dismiss',e.message,'bad');}};

let fbQ='';
async function viewFeedback(){
  const r=await api('feedback');
  const q=fbQ.trim().toLowerCase();
  const list=q?r.feedback.filter(f=>[f.username,f.text,f.country].some(v=>String(v||'').toLowerCase().includes(q))):r.feedback;
  const week=r.feedback.filter(f=>Date.now()-f.ts<7*86400000).length;
  $('#main').innerHTML=`<div class="card anim" style="margin-top:0"><h2>⭐ User feedback <span class="sub">${q?list.length+' of '+r.feedback.length+' shown':r.feedback.length+' total'} · ${num(week)} this week</span></h2>
  <div class="tbar"><input id="fbQ" class="grow" placeholder="Search feedback…" value="${esc(fbQ)}">${fbQ?'<button class="lnk" id="fbClear">Clear</button>':''}${exportLink('feedback','Export feedback')}</div>
  <div class="feed">
  ${list.map(f=>`<div class="fmsg"><div class="top"><span><b>${esc(f.username)}</b>${f.country?` · ${esc(f.country)}`:''}${f.source==='dev-notice'?' · <span class="pill info">landing notice</span>':''}</span><span>${ago(f.ts)} · ${fmtTs(f.ts)}</span></div>
  <div class="txt">${esc(f.text)}</div></div>`).join('')||`<div class="muted">${q?'No feedback matches that search.':'No feedback yet.'}</div>`}
  </div></div>`;
  const inp=$('#fbQ');
  onFilterInput(inp,(v)=>{fbQ=v;},()=>viewFeedback().then(()=>keepFocus('#fbQ')));
  const cl=$('#fbClear');if(cl)cl.onclick=()=>{fbQ='';viewFeedback();};
}

async function viewAudit(){
  const r=await api('audit');
  const fails=r.audit.filter(a=>/fail|lockout/.test(a.action)).length;
  $('#main').innerHTML=`<div class="card anim" style="margin-top:0"><h2>🧾 Security audit log <span class="sub">every login, ban and admin action · ${r.audit.length} entries${fails?` · <b style="color:var(--crit)">${fails} failed sign-in event(s)</b>`:''}</span></h2>
  <table><tr><th>When</th><th>Action</th><th>IP</th><th>Detail</th></tr>
  ${r.audit.map(a=>`<tr><td>${fmtTs(a.ts)}<br><span class="muted">${ago(a.ts)}</span></td><td><span class="pill ${/fail|lockout/.test(a.action)?'crit':'info'}">${esc(a.action)}</span></td><td class="muted">${esc(a.ip)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Empty.</td></tr>'}</table></div>`;
}

async function viewSettings(){
  const o=await api('overview');
  const m=o.maintenance;
  const theme=currentTheme();
  $('#main').innerHTML=`<div class="card anim" style="margin-top:0"><h2>🛠️ Maintenance mode</h2>
  <p class="muted" style="margin-bottom:12px">When on, visitors see a friendly maintenance page and nobody can connect. Your dashboard stays available.</p>
  <div class="switch"><b>Status:</b> ${m.on?'<span class="pill crit">MAINTENANCE ON - site is down for users</span>':'<span class="pill good">Site is LIVE</span>'}</div>
  <label style="display:block;margin:14px 0 6px;font-size:.85rem;color:var(--ink2)">Message shown to users</label>
  <textarea id="maintMsg" rows="3">${esc(m.message)}</textarea>
  <div class="rowbtns" style="margin-top:12px">
    <button class="${m.on?'':'danger'}" id="maintBtn">${m.on?'✅ Bring site back online':'⛔ Take site into maintenance'}</button>
  </div></div>

  <div class="card anim"><h2>🎨 Appearance</h2>
  <p class="muted" style="margin-bottom:12px">Stored in this browser only. Press <b>t</b> anywhere to cycle it.</p>
  <div class="seg">${THEMES.map(t=>`<button data-theme-set="${t}" class="${theme===t?'on':''}">${t==='auto'?'🌗 Auto':t==='dark'?'🌙 Dark':'☀️ Light'}</button>`).join('')}</div></div>

  <div class="card anim"><h2>⬇️ Export your data <span class="sub">downloads a copy · nothing is removed from the server</span></h2>
  <div class="tbar" style="margin:0">
    ${exportLink('accounts','Accounts')}${exportLink('daily','Daily traffic')}${exportLink('countries','Countries')}
    ${exportLink('premium','Subscriptions')}${exportLink('bans','Bans')}${exportLink('reports','Reports')}${exportLink('feedback','Feedback')}
  </div></div>

  <div class="card anim"><h2>⌨️ Shortcuts &amp; tips</h2>
  <div class="kbdlist">${SHORTCUTS.map(([k,d])=>`<kbd>${esc(k)}</kbd><span>${esc(d)}</span>`).join('')}</div>
  <p class="muted" style="margin-top:12px">Report timezone is set in the Activity tab and is used everywhere “today” appears.</p></div>`;
  $('#maintBtn').onclick=async()=>{
    if(!m.on&&!confirm('Take TalkLive OFFLINE for all users?'))return;
    try{
      await post('maintenance',{on:!m.on,message:$('#maintMsg').value});
      toast(m.on?'Site is live again':'Maintenance mode ON',m.on?'Users can connect.':'Visitors now see your maintenance message.',m.on?'good':'warn');
      load();
    }catch(e){toast('Could not change maintenance mode',e.message,'bad');}
  };
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.themeSet;
    try{localStorage.setItem('tl_theme',t);}catch(e){}
    applyTheme(t);viewSettings();
  });
}

window.go=go;
window.load=load;
boot();
</script>
</body>
</html>
