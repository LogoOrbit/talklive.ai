  }
  if(kind==='week'){
    const r=await api('activity?tz='+encodeURIComponent(actTz||browserTz()));
    const cur=r.weekly[r.weekly.length-1],prev=r.weekly[r.weekly.length-2];
    const best=r.daily.reduce((b,d)=>d.visits>(b?b.visits:-1)?d:b,null);
    return `**This week** (${cur.weekStart} → ${cur.weekEnd}, ${cur.daysElapsed}/7 days)\n`
      +`- ${num(cur.uniques)} unique visitors, ${num(cur.visits)} visits\n`
      +`- ${num(cur.connections)} connections, ${num(cur.matches)} matches, ${num(cur.messages)} messages\n`
      +`- Peak of ${num(cur.peakOnline)} online\n\n`
      +`**Last full week** (${prev.weekStart} → ${prev.weekEnd})\n`
      +`- ${num(prev.uniques)} unique visitors, ${num(prev.visits)} visits, peak ${num(prev.peakOnline)}\n\n`
      +(best&&best.visits?`Best day in the last 30: **${best.day}** (${num(best.visits)} visits, peak ${num(best.peakOnline)}).`:'Not enough traffic yet to pick a best day.');
  }
  if(kind==='features'){
    if(!o.features.length)return 'No feature usage recorded yet.';
    return '**Top features, last 30 days**\n\n'+o.features.slice(0,5).map(([f,n],i)=>`${i+1}. ${f} - ${num(n)} uses`).join('\n');
  }
  if(kind==='feedback'){
    const r=await api('feedback');
    if(!r.feedback.length)return 'No user feedback submitted yet.';
    return `**${num(r.feedback.length)}** feedback message(s). Latest:\n\n`+r.feedback.slice(0,5).map(f=>`- **${f.username}**${f.country?' ('+f.country+')':''}: “${f.text.slice(0,140)}”`).join('\n');
  }
  if(kind==='problems'){
    const lines=[];
    if(o.counts.unhandledReports)lines.push(`- 🚩 **${o.counts.unhandledReports}** unhandled report(s) - Reports tab`);
    if(o.counts.errors)lines.push(`- 🐛 **${o.counts.errors}** error record(s) - Errors tab`);
    if(o.counts.activeBans)lines.push(`- ⛔ **${o.counts.activeBans}** active ban(s)`);
    if(sum7('errors')>5)lines.push(`- ⚠️ ${sum7('errors')} error events this week`);
    if(o.maintenance.on)lines.push('- 🛠️ **Maintenance mode is ON**');
    return lines.length?lines.join('\n'):'✅ All clear - no unhandled reports, errors or active bans.';
  }
  if(kind==='audience'){
    if(!o.countries.length)return 'No geo data yet.';
    return '**Top countries, last 30 days**\n\n'+o.countries.slice(0,5).map(([c,n],i)=>`${i+1}. ${c} - ${num(n)} visits`).join('\n')+(o.cities[0]?`\n\nTop city: **${o.cities[0][0]}** (${num(o.cities[0][1])} visits).`:'');
  }
  const L=live||o.runtime.live||{chatting:o.runtime.inCall,voice:o.runtime.inCall,text:0,waiting:o.runtime.waiting,online:o.runtime.online};
  return `**Right now:** ${num(L.online)} online - ${num(L.chatting)} chatting (${num(L.voice)} voice, ${num(L.text)} text), ${num(L.waiting)} waiting.\n\n`
    +`**Today:** ${num(o.today.uniques)} unique visitors, ${num(o.today.matches)} matches, peak ${num(o.today.peakOnline)}.\n\n`
    +`Server up ${Math.floor(o.runtime.uptimeSeconds/3600)}h, ${o.runtime.memoryMB} MB RAM.`;
}

/* Small, safe Markdown: everything is escaped first, then only a known set of
   constructs is turned back into tags. */
function mdInline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,!?:;]|$)/g,'$1<i>$2</i>')
    .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,!?:;]|$)/g,'$1<i>$2</i>');
}
function md(src){
  const lines=esc(src).split('\n'),out=[];let i=0;
  const cells=(l)=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  while(i<lines.length){
    const l=lines[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out.push(`<pre><code>${buf.join('\n')}</code></pre>`);continue;}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      const head=cells(l);i+=2;const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))rows.push(cells(lines[i++]));
      out.push(`<div class="mdtable"><table class="mdt"><thead><tr>${head.map(h=>`<th>${mdInline(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
    }
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){out.push(`<div class="mdh h${h[1].length}">${mdInline(h[2])}</div>`);i++;continue;}
    if(/^\s*([-*•]|\d+[.)])\s+/.test(l)){
      const ordered=/^\s*\d/.test(l),items=[];
      while(i<lines.length&&/^\s*([-*•]|\d+[.)])\s+/.test(lines[i])){
        const sub=/^\s{2,}/.test(lines[i]);
        items.push(`<li${sub?' class="sub"':''}>${mdInline(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/,''))}</li>`);i++;
      }
      out.push(ordered?`<ol>${items.join('')}</ol>`:`<ul>${items.join('')}</ul>`);continue;
    }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){out.push('<hr>');i++;continue;}
    if(!l.trim()){i++;continue;}
    const para=[];
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|```|\s*([-*•]|\d+[.)])\s+|\s*\|.*\|\s*$)/.test(lines[i]))para.push(lines[i++]);
    if(!para.length){out.push(`<p>${mdInline(lines[i++])}</p>`);continue;}
    out.push(`<p>${mdInline(para.join('<br>'))}</p>`);
  }
  return out.join('');
}

/* Action approval card. Nothing the agent proposes runs until the owner ticks it
   and presses Approve; the server executes exactly the ticked ones. */
const ACT_STATE={ok:'<span class="pill good">✓ Done</span>',failed:'<span class="pill crit">Failed</span>',declined:'<span class="pill info">Declined</span>',running:'<span class="spin"></span>'};
function confirmHtml(m,idx){
  const c=m.confirm;if(!c)return '';
  const open=!c.decided;
  return `<div class="botconfirm ${open?'open':''}">
    <div class="ct">${open?'🛡️ Approve before I do this':'🛡️ Actions'}</div>
    ${c.actions.map((a,j)=>`<label class="act">${open?`<input type="checkbox" ${a.checked!==false?'checked':''} onchange="botTick(${idx},${j},this.checked)">`:''}
      <span class="atag">${esc(a.label)}</span><span class="asum">${esc(a.summary)}${a.error?`<span class="aerr">${esc(a.error)}</span>`:''}</span>${open?'':`<span class="ast">${ACT_STATE[a.status]||''}</span>`}</label>`).join('')}
    ${open?`<div class="cbtns"><button class="approve" onclick="botDecide(${idx},true)">✓ Approve${c.actions.length>1?' selected':''}</button><button onclick="botDecide(${idx},false)">Decline</button></div>`:''}
  </div>`;
}
function botMsgHtml(m,idx){
  if(m.me)return `<div class="msg me"><div class="bubble">${esc(m.text)}</div></div>`;
  const tools=(m.tools||[]).length?`<div class="botsteps">${m.tools.map((t,j)=>`<span class="step ${m.pending&&j===m.tools.length-1&&!m.text?'on':''}">${m.pending&&j===m.tools.length-1&&!m.text?'<span class="spin"></span>':'✓'} ${esc(t)}</span>`).join('')}</div>`:'';
  const body=m.text?`<div class="md">${md(m.text)}</div>`:m.pending?(tools?'':'<div class="typing"><span></span><span></span><span></span></div>'):'';
  const err=m.error?`<div class="boterr">⚠️ ${esc(m.error)}</div>`:'';
  const acts=!m.pending&&m.text&&idx!=null?`<div class="botacts"><button onclick="botCopy(${idx})" title="Copy answer">⧉ Copy</button></div>`:'';
  return `<div class="msg"><div class="avatar">🤖</div><div class="bubble">${tools}${body}${confirmHtml(m,idx)}${err}${acts}</div></div>`;
}
function renderBot(){
  const el=$('#botlog');if(!el)return;

  el.innerHTML=botLog.map((m,i)=>botMsgHtml(m,i)).join('');

/* Repaint only the bubble that is streaming, so a long answer doesn't rebuild the
   whole log on every token. */
let botPaintQueued=false;
function paintLast(){
  if(botPaintQueued)return;botPaintQueued=true;
  requestAnimationFrame(()=>{
    botPaintQueued=false;
    const el=$('#botlog');if(!el)return;
    const last=el.lastElementChild,m=botLog[botLog.length-1];
    if(!last||!m||m.me)return renderBot();
    const sc=$('#botScroll'),stick=sc&&sc.scrollHeight-sc.scrollTop-sc.clientHeight<80;
    last.outerHTML=botMsgHtml(m,botLog.length-1);
    if(stick)sc.scrollTop=sc.scrollHeight;
  });
}
window.botCopy=(i)=>{const m=botLog[i];if(!m)return;navigator.clipboard&&navigator.clipboard.writeText(m.text).then(()=>toast('Copied','Answer copied to the clipboard.','good'),()=>{});};
window.botNew=async()=>{
  if(botBusy&&botAbort)botAbort.abort();
  if(botConv)post('ai/reset',{conversationId:botConv}).catch(()=>{});
  botLog=[];botConv=null;botSave();renderBot();

};
window.askQuick=async(kind,label)=>{
  botLog.push({me:true,text:label});const m={me:false,text:'',pending:true};botLog.push(m);renderBot();
  try{m.text=await botAnswer(kind);}catch(e){m.error='Could not fetch that: '+e.message;}
  m.pending=false;botSave();renderBot();
};
const openConfirm=()=>botLog.find(m=>m.confirm&&!m.confirm.decided);
window.botTick=(i,j,on)=>{const c=botLog[i]&&botLog[i].confirm;if(c&&c.actions[j])c.actions[j].checked=on;};
window.botDecide=(i,approve)=>{
  const c=botLog[i]&&botLog[i].confirm;if(!c||c.decided||botBusy)return;
  const decisions={};
  for(const a of c.actions){decisions[a.id]=approve&&a.checked!==false;a.status=decisions[a.id]?'running':'declined';}
  c.decided=true;renderBot();
  botRun({decisions});
};
window.askBot=(q)=>{
  q=String(q||'').trim();
  if(!q||botBusy)return;
  if(botStatus&&!botStatus.configured){toast('AI agent is off',botStatus.reason||'Set ANTHROPIC_API_KEY.','warn');return;}
  const inp=$('#botInput');if(inp){inp.value='';inp.style.height='';}
  /* Typing instead of answering a pending card declines it (the server does the same). */
  const pend=openConfirm();if(pend){pend.confirm.decided=true;pend.confirm.actions.forEach(a=>a.status='declined');}
  const history=botLog.filter(m=>m.text&&!m.error).map(m=>({role:m.me?'user':'assistant',text:m.text}));
  botLog.push({me:true,text:q});
  botRun({message:q,history});
};
async function botRun(payload){
  const m={me:false,text:'',tools:[],pending:true};botLog.push(m);
  botBusy=true;renderBot();
  botAbort=new AbortController();
  const actById=(id)=>{for(const x of botLog)if(x.confirm)for(const a of x.confirm.actions)if(a.id===id)return a;return null;};
  try{
    const r=await fetch('/owner/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:botAbort.signal,
      body:JSON.stringify({...payload,conversationId:botConv,tz:actTz||browserTz()})});
    if(r.status===401){clearInterval(timer);show('login');throw new Error('auth');}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'Request failed');}
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl);buf=buf.slice(nl+1);if(!line.trim())continue;
        let ev;try{ev=JSON.parse(line);}catch(_){continue;}
        if(ev.type==='conv')botConv=ev.id;
        else if(ev.type==='tool'){if(!m.tools.includes(ev.label))m.tools.push(ev.label);}
        else if(ev.type==='text')m.text+=ev.delta;
        else if(ev.type==='error')m.error=ev.error;
        else if(ev.type==='confirm')m.confirm={actions:ev.actions.map(a=>({...a,checked:true}))};
        else if(ev.type==='action'){
          const a=actById(ev.id);
          if(a){a.status=ev.ok?'ok':ev.declined?'declined':'failed';a.error=ev.error||null;}
          if(ev.ok)counts={};
          renderBot();continue;
        }
        paintLast();
      }
    }
  }catch(e){
    if(e.name==='AbortError')m.text+=(m.text?'\n\n':'')+'_Stopped._';
    else if(e.message!=='auth')m.error=e.message;
  }
  /* Anything still "running" never got a result back. */
  for(const x of botLog)if(x.confirm)for(const a of x.confirm.actions)if(a.status==='running'){a.status='failed';a.error=a.error||'No result came back - check the Audit log.';}
  m.pending=false;botBusy=false;botAbort=null;
  if(!m.text&&!m.error&&!m.confirm)m.error='No answer came back. Try again.';
  botSave();renderBot();
  const i=$('#botInput');if(i&&window.matchMedia('(pointer:fine)').matches)i.focus();
}

  document.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{liveStatus=b.dataset.ls;load();});
}

/* Reports: the queue (unhandled / handled / all), and a "Most reported" leaderboard of
   the people reported most over a chosen window, each one a click away from
   their full report history, a warning or a ban. */
let repFilter='open',repQ='',repUser=null,repDays=30,repSort='count';
const REP_RANGES=[[1,'24h'],[7,'7 days'],[30,'30 days'],[0,'All time']];
const REP_SORTS=[['count','Most reports'],['reporters','Most reporters'],['open','Most unhandled'],['lastTs','Most recent']];

const repPlace=(u)=>esc(u.country||'')+(u.city&&u.city!=='Unknown'?', '+esc(u.city):'');

  if(repFilter==='top'){

      .sort((a,b)=>b[key]-a[key]||b.count-a.count);
    const max=Math.max(1,...top.map(u=>u.count));
    const totalR=r.reasons.reduce((a,x)=>a+x[1],0);
    body=`<div class="card anim"><h2>🏆 Most reported people <span class="sub">${esc(rangeTxt)} · ${num(top.length)} ${top.length===1?'person':'people'}</span></h2>
    <div class="tbar">${seg}</div>
    <div class="tbar">
      <div class="seg">${REP_RANGES.map(([d,l])=>`<button data-rd="${d}" class="${repDays===d?'on':''}">${l}</button>`).join('')}</div>

    <table><tr><th>#</th><th>Person</th><th class="num">Reports</th><th class="num">Reporters</th><th class="num">Unhandled</th><th>Top reasons</th><th>Last reported</th><th>Actions</th></tr>
    ${top.map((u,i)=>`<tr style="${u.activeBan?'opacity:.6':''}">
      <td><b>${i<3&&repSort==='count'&&!q?['🥇','🥈','🥉'][i]:'#'+(i+1)}</b></td>
      <td><b>${esc(u.username||'(no name)')}</b>${u.activeBan?' <span class="pill crit">BANNED</span>':''}<br><span class="muted">${repPlace(u)||'—'}</span>${u.latestDetail?`<br><span class="muted" style="font-size:.78rem">“${esc(u.latestDetail.slice(0,120))}”</span>`:''}</td>

    ${r.reasons.length?`<div class="card anim"><h2>📊 Why people get reported <span class="sub">${esc(rangeTxt)} · ${num(totalR)} reports</span></h2>
      ${r.reasons.slice(0,8).map(([k,n])=>`<div class="hrow"><div title="${esc(k)}">${esc(k)}</div><div><div class="hbar" style="width:${Math.max(2,n/r.reasons[0][1]*100)}%;background:var(--grad)"></div></div><div class="n">${num(n)} · ${pctOf(n,totalR)}</div></div>`).join('')}</div>`:''}`;
    window.repOpenUser=(i)=>{const u=top[i];repUser={clientId:u.clientId,username:u.username};repFilter='all';repQ='';load();};
  }else{
    const base=repFilter==='open'?r.reports.filter(x=>!x.handled):repFilter==='handled'?r.reports.filter(x=>x.handled):r.reports;
    const list=base.filter(x=>hit([x.reported.username,x.reported.country,x.reported.city,x.reason,x.detail,x.reporter.username,x.reporter.country]));
    const who=repUser?`<div class="tbar"><span class="pill info" style="font-size:.8rem;padding:6px 12px">👤 Only reports on <b>${esc(repUser.username||repUser.clientId.slice(0,12))}</b> · ${num(r.reports.length)} total</span><button class="lnk" id="repUserClear">Show everyone</button></div>`:'';
    body=`<div class="card anim"><h2>🚩 User reports <span class="sub">${num(list.length)} shown · one-click ban with duration</span></h2>
    <div class="tbar">${seg}${exportLink('reports','Export reports')}</div>
    ${who}
    <div class="tbar">${search}</div>
    <table><tr><th>When</th><th>Reported user</th><th>Reason</th><th>Reporter</th><th class="num">Total reports</th><th>Actions</th></tr>
    ${list.map(rep=>`<tr style="${rep.handled?'opacity:.55':''}">
    <td>${ago(rep.ts)}<br><span class="muted">${fmtTs(rep.ts)}</span></td>
    <td><b>${esc(rep.reported.username)}</b>${rep.activeBan?' <span class="pill crit">BANNED</span>':''}<br><span class="muted">${repPlace(rep.reported)}</span></td>
    <td><b>${esc(rep.reason)}</b>${rep.detail?`<br><span class="muted">“${esc(rep.detail)}”</span>`:''}</td>
    <td>${esc(rep.reporter.username)}<br><span class="muted">${esc(rep.reporter.country)}</span></td>
    <td class="num">${repUser?repPill(rep.totalReportsOnUser):`<button class="lnk" style="background:none;cursor:pointer;padding:4px 8px" title="See every report on this person" onclick="repFocus('${jsq(rep.reported.clientId)}','${jsq(rep.reported.username)}')">${repPill(rep.totalReportsOnUser)}</button>`}</td>
    <td><div class="rowbtns">
      ${warnBtn(rep.reported.clientId,'',rep.reported.username,rep.reported.country)}
      ${rep.activeBan?'':repBan(rep.reported)}
      ${rep.handled?'':`<button onclick="markHandled('${jsq(rep.id)}')">Mark handled</button>`}
    </div></td></tr>`).join('')||`<tr><td colspan="6" class="muted">${q?'No report matches that filter.':repFilter==='open'?'Nothing waiting - every report has been handled. 🎉':repFilter==='handled'?'No handled reports yet.':'No reports yet - good sign!'}</td></tr>`}</table></div>`;
  }
  $('#main').innerHTML=tiles+body;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{repFilter=b.dataset.f;if(repFilter==='top')repUser=null;load();});
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{repDays=Number(b.dataset.rd);load();});
  const so=$('#repSort');if(so)so.onchange=()=>{repSort=so.value;viewReports();};
  const inp=$('#repQ');if(inp)onFilterInput(inp,(v)=>{repQ=v;},()=>viewReports().then(()=>keepFocus('#repQ')));
  const cl=$('#repClear');if(cl)cl.onclick=()=>{repQ='';viewReports();};
  const uc=$('#repUserClear');if(uc)uc.onclick=()=>{repUser=null;load();};

/* ---------- chats: conversation reader ----------
   Chat used to render as one flat, newest-first feed of every message from
   every pair. That is unreadable for the job it exists for - judging whether
   conversations on the app are healthy - because consecutive lines almost never
   belong to the same conversation.

   So: the server folds the store into conversations and scores each one, this
   picks one to read, and the thread renders as a real transcript. The list
   carries enough (who, how long, what was said last, what tripped a flag) to
   skip a conversation without opening it, which is where the time actually
   goes. j/k move, Enter opens, Esc goes back, so a review pass never needs
   the mouse. */
let chatQuery='',chatKind='',chatFlagged=false,chatSort='recent',chatOpen=null,chatRows=[],chatCursor=-1;

const FLAG_LABEL={minor:'age',sexual:'sexual',contact:'contact',link:'link',money:'money',abuse:'abuse'};
const flagChips=(flags)=>(flags||[]).map(f=>`<span class="fl ${f}">${FLAG_LABEL[f]||esc(f)}</span>`).join('');

const clock=(ts)=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

/* "4m", "1h 12m" - how long the pair actually talked, which separates a real
   conversation from two people saying hi and leaving. */
function span(ms){
  const m=Math.round(ms/60000);
  if(m<1)return'<1m';
  if(m<60)return m+'m';
  return Math.floor(m/60)+'h '+(m%60)+'m';
}

function convRow(c,i){
  const names=c.people.map(p=>esc(p.name)).join(' <span class="muted">&#8596;</span> ')||'unknown';
  return `<button class="cvrow${c.pair===chatOpen?' on':''}" data-pair="${esc(c.pair)}" data-i="${i}">
    <span class="who">${names}
      ${c.kind==='friend'?'<span class="pill info">Friends</span>':'<span class="pill warn">Stranger</span>'}
      ${c.oneSided?'<span class="pill crit">One-sided</span>':''}</span>
    <span class="prev">${esc(c.preview)||'<span class="muted">(no text)</span>'}</span>
    <span class="meta"><span>${num(c.count)} msg</span><span>${span(c.end-c.start)}</span><span>${ago(c.end)}</span>${c.country?`<span>${esc(c.country)}</span>`:''}</span>
    ${c.flags.length?`<span class="cvflags">${flagChips(c.flags)}</span>`:''}
  </button>`;
}

async function viewChats(){
  const params=new URLSearchParams();
  if(chatQuery)params.set('q',chatQuery);
  if(chatKind)params.set('kind',chatKind);
  if(chatFlagged)params.set('flagged','1');
  if(chatSort!=='recent')params.set('sort',chatSort);
  const qs=params.toString();
  const r=await vapi('transcripts'+(qs?'?'+qs:''));
  chatRows=r.conversations||[];
  /* A conversation that fell out of the current filter must not stay selected -
     the thread pane would keep showing something the list no longer offers. */
  if(chatOpen&&!chatRows.some(c=>c.pair===chatOpen))chatOpen=null;
  chatCursor=chatRows.findIndex(c=>c.pair===chatOpen);

  const flagged=chatRows.filter(c=>c.flags.length).length;
  $('#main').innerHTML=`<div class="card anim" style="margin-top:0">
  <h2>&#128172; Conversations <span class="sub">${num(r.matched||chatRows.length)} threads &middot; ${num(r.total)} messages stored &middot; text only, voice is peer-to-peer and never recorded</span></h2>
  <div class="searchbar">
    <input id="chatQ" placeholder="Search by username, ID or message text&hellip;" value="${esc(chatQuery)}">
    <button class="btn" id="chatQBtn">Search</button>
  </div>
  <div class="tbar">
    <div class="seg">
      <button data-ck="" class="${chatKind===''?'on':''}">All</button>
      <button data-ck="stranger" class="${chatKind==='stranger'?'on':''}">Strangers</button>
      <button data-ck="friend" class="${chatKind==='friend'?'on':''}">Friends</button>
    </div>
    <div class="seg">
      <button data-cs="recent" class="${chatSort==='recent'?'on':''}">Recent</button>
      <button data-cs="longest" class="${chatSort==='longest'?'on':''}">Longest</button>
      <button data-cs="risk" class="${chatSort==='risk'?'on':''}">Needs review</button>
    </div>
    <div class="seg"><button id="chatFlagBtn" class="${chatFlagged?'on':''}">&#9873; Flagged only (${num(flagged)})</button></div>
  </div>
  <div class="cvwrap${chatOpen?' reading':''}" id="cvwrap">
    <div class="cvlist" id="cvlist">
      ${chatRows.map(convRow).join('')||'<div class="cvempty">No conversations match. Clear the filters, or wait for people to talk.</div>'}
    </div>
    <div class="cvthread" id="cvthread"><div class="cvempty">Pick a conversation to read it.<br><span class="muted">j / k to move, Enter to open, Esc to come back.</span></div></div>
  </div></div>`;

  const go=()=>{chatQuery=$('#chatQ').value.trim();chatOpen=null;load();};
  $('#chatQBtn').onclick=go;
  $('#chatQ').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{chatKind=b.dataset.ck;chatOpen=null;load();});
  document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{chatSort=b.dataset.cs;load();});
  $('#chatFlagBtn').onclick=()=>{chatFlagged=!chatFlagged;chatOpen=null;load();};
  /* One listener for the whole list rather than one per row. */
  $('#cvlist').addEventListener('click',e=>{
    const row=e.target.closest('.cvrow');
    if(row)openConversation(row.dataset.pair,Number(row.dataset.i));
  });
  if(chatOpen)openConversation(chatOpen,chatCursor);
}

/* Fetches and renders one thread. Deliberately does NOT call load(): re-running
   the whole tab to open a conversation would refetch the list and throw away
   the reader's scroll position on every click. */
async function openConversation(pair,i){
  chatOpen=pair;
  if(typeof i==='number'&&i>=0)chatCursor=i;
  document.querySelectorAll('.cvrow').forEach(b=>b.classList.toggle('on',b.dataset.pair===pair));
  const wrap=$('#cvwrap'),pane=$('#cvthread');
  if(!pane)return;
  wrap.classList.add('reading');
  pane.innerHTML='<div class="cvempty">Loading&hellip;</div>';
  let c;
  try{
    const r=await api('transcripts?pair='+encodeURIComponent(pair));
    if(chatOpen!==pair||!pane.isConnected)return;
    c=r.conversation;
  }catch(e){
    if(chatOpen!==pair||!pane.isConnected)return;
    pane.innerHTML=`<div class="cvempty">Could not load this conversation.<br><span class="muted">${esc(e.message)}</span></div>`;
    return;
  }
  /* The transcript has no "me", so sides are assigned by who spoke first and
     held for the whole thread - otherwise the bubbles would swap sides between
     renders and the thread would be unreadable. */
  const order=[];
  for(const m of c.messages){if(m.fromClientId&&order.indexOf(m.fromClientId)===-1)order.push(m.fromClientId);}
  const sideOf=(id)=>order.indexOf(id)===1?'b':'a';
  const byId={};
  for(const m of c.messages)if(m.id)byId[m.id]=m;

  let lastFrom=null,lastTs=0;
  const body=c.messages.map(m=>{
    const side=sideOf(m.fromClientId);
    let out='';
    /* A gap longer than five minutes is usually a different sitting; marking it
       stops two separate exchanges reading as one. */
    if(lastTs&&m.ts-lastTs>300000)out+=`<div class="cvgap">- ${span(m.ts-lastTs)} later -</div>`;
    if(m.fromClientId!==lastFrom)out+=`<div class="cvname ${side}">${esc(m.from)}</div>`;
    lastFrom=m.fromClientId;lastTs=m.ts;
    const q=m.replyTo&&byId[m.replyTo]?`<span class="q">&#8618; ${esc(String(byId[m.replyTo].text||'').slice(0,90))}</span>`:'';
    /* Clock time only on the bubble - a transcript is read as one sitting, so
       repeating the date on every line is pure noise. The full stamp stays on
       the title, and the thread header carries the date. */
    return out+`<div class="cvb ${side}${m.flags.length?' risk':''}">${q}${esc(m.text)}
      ${m.flags.length?`<span class="cvflags">${flagChips(m.flags)}</span>`:''}
      <span class="t" title="${esc(fmtTs(m.ts))}">${clock(m.ts)}</span></div>`;
  }).join('');

  const bans=c.people.map(p=>warnBtn(p.clientId,'',p.name,c.country,'Warn '+esc(p.name)+'&hellip;')
    +`<button class="danger" onclick="banUser('${jsq(p.clientId)}','','${jsq(p.name)}','${jsq(c.country||'')}','')">Ban ${esc(p.name)}&hellip;</button>`).join('');
  pane.innerHTML=`<div class="cvthead">
    <button class="cvback" id="cvBack">&#8592; List</button>
    <h3>${c.people.map(p=>esc(p.name)).join(' &#8596; ')}
      <span class="sub">${num(c.count)} messages &middot; ${span(c.end-c.start)} &middot; ${fmtTs(c.end)} (${ago(c.end)})${c.country?' &middot; '+esc(c.country):''} &middot; ${c.kind==='friend'?'friends':'strangers'}</span></h3>
    <div class="rowbtns">${bans}</div>
  </div>
  <div class="cvbody">${body||'<div class="cvempty">No messages.</div>'}</div>`;
  const back=$('#cvBack');
  if(back)back.onclick=closeConversation;
  /* Newest at the bottom, like every chat app - so the pane opens where the
     conversation ended. */
  pane.scrollTop=pane.scrollHeight;
}

function closeConversation(){
  chatOpen=null;
  const wrap=$('#cvwrap');
  if(wrap)wrap.classList.remove('reading');
  document.querySelectorAll('.cvrow').forEach(b=>b.classList.remove('on'));
}

/* Keyboard review pass. Only live while the Chats tab is showing and the
   operator is not typing into the search box. */
document.addEventListener('keydown',(e)=>{
  if(tab!=='chats')return;
  const el=document.activeElement;
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable))return;
  if(e.key==='Escape'){closeConversation();return;}
  if(e.key!=='j'&&e.key!=='k'&&e.key!=='Enter')return;
  if(!chatRows.length)return;
  e.preventDefault();
  if(e.key==='Enter'){
    if(chatCursor>=0)openConversation(chatRows[chatCursor].pair,chatCursor);
    return;
  }
  chatCursor=Math.max(0,Math.min(chatRows.length-1,chatCursor+(e.key==='j'?1:-1)));
  const row=document.querySelector(`.cvrow[data-i="${chatCursor}"]`);
  if(row){
    row.scrollIntoView({block:'nearest'});
    /* On a wide screen both panes are visible, so moving the cursor may as well
       load the thread; on a narrow one that would hide the list mid-scroll. */
    if(window.innerWidth>1000)openConversation(chatRows[chatCursor].pair,chatCursor);
    else document.querySelectorAll('.cvrow').forEach(b=>b.classList.toggle('on',b===row));
  }
});

    <div class="tile"><div class="k">Sign-up method</div><div class="v" style="font-size:1.15rem">${num(google)} / ${num(total-google)}</div><div class="s">Google / password</div></div>
    <div class="tile"><div class="k">Emails on file</div><div class="v" data-count="${withEmail}">0</div><div class="s">${num(verified)} verified by Google</div></div>
  </div>
  <div class="card anim"><h2>\u{1F30D} Accounts by country <span class="sub">${ranked.length} ${ranked.length===1?'country':'countries'} · ${num(total)} accounts</span>
  <span style="margin-left:auto;display:flex;gap:8px">${exportLink('countries','Country CSV')}

  <td><div class="rowbtns"><button class="lnk accToggle" data-k="${esc(a.key)}">${accOpen===a.key?'Hide':'Details'}</button>${warnBtn(a.clientId,a.key,a.username||a.key,a.country)}</div></td></tr>
  ${accOpen===a.key?accProfileRow(a):''}`).join('')||`<tr><td colspan="${ACC_COLS.length+1}" class="muted">${q?'No account matches that search.':'No accounts registered yet.'}</td></tr>`}</table></div>`;

  document.querySelectorAll('.accToggle').forEach(b=>b.onclick=()=>{

  const inp=$('#accQ');

  document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{

/* ---------- talk time: who talked for how long ---------- */
let ttRange='all',ttSort='most',ttMin=0,ttQ='';
const TT_SORTS=[['most','Most talk time'],['least','Least talk time'],['calls','Most conversations'],['fewest','Fewest conversations'],['avg','Longest average'],['longest','Longest single call'],['recent','Recently talked']];
const TT_MIN=[[0,'Any length'],[60,'≥ 1 min'],[600,'≥ 10 min'],[1800,'≥ 30 min'],[3600,'≥ 1 hour']];
const dur=(s)=>{s=Math.round(s||0);if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m '+String(s%60).padStart(2,'0')+'s';const h=Math.floor(m/60);return h+'h '+String(m%60).padStart(2,'0')+'m';};

    fewest:(a,b)=>a.calls-b.calls||a.seconds-b.seconds,avg:(a,b)=>b.avg-a.avg,longest:(a,b)=>b.longest-a.longest,recent:(a,b)=>b.lastAt-a.lastAt}[ttSort];

  </div>

  <div class="tbar">

    <input id="ttQ" class="grow" placeholder="Search name, account, country…" value="${esc(ttQ)}">

  </div>
  <table><tr><th class="num">#</th><th>User</th><th>Country</th><th>Talk time</th><th class="num">Conversations</th><th class="num">Avg</th><th class="num">Longest call</th><th>Last talked</th></tr>
  ${shown.map((x,i)=>`<tr><td class="num muted">${i+1}</td>
    <td><b>${esc(x.username)}</b>${x.account?` <span class="pill info" title="Registered account">${esc(x.account)}</span>`:''}</td>
    <td>${esc(x.country||'')}</td>
    <td style="min-width:160px"><div style="display:flex;align-items:center;gap:8px"><div class="cbar" style="height:10px;border-radius:99px;background:var(--accent);width:${Math.max(2,x.seconds/max*100)}%;max-width:110px"></div><b style="white-space:nowrap">${dur(x.seconds)}</b></div></td>
    <td class="num">${num(x.calls)}</td><td class="num">${dur(x.avg)}</td><td class="num">${dur(x.longest)}</td>

let vnQ='',vnFlagged=false,vnSort='recent';
function vnDur(ms){const s=Math.round((ms||0)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
async function viewVoiceNotes(){
  const params=new URLSearchParams();
  if(vnQ)params.set('q',vnQ);
  if(vnFlagged)params.set('flagged','1');
  if(vnSort!=='recent')params.set('sort',vnSort);
  const qs=params.toString();
  const r=await vapi('voice-notes'+(qs?'?'+qs:''));
  const note=n=>{
    const t=n.tags||{};
    const flags=(t.flags||[]).map(f=>`<span class="pill ${['minor','sexual','abuse'].includes(f)?'crit':'warn'}">⚑ ${esc(f)}</span>`).join(' ');
    const topics=(t.topics||[]).map(x=>`<span class="pill info">${esc(x)}</span>`).join(' ');
    const src=t.source==='ai'?'AI tags':t.source==='keywords'?'keyword tags':'';
    return `<div class="fmsg vnote${n.severe?' vsev':''}">
      <div class="top"><span><b>${esc(n.fromName||n.from)}</b> → <b>${esc(n.toName||n.to||'friend')}</b> · ${vnDur(n.ms)}</span><span>${ago(n.ts)} · ${fmtTs(n.ts)}</span></div>
      <audio controls preload="none" src="/owner/api/voice-notes/${encodeURIComponent(n.id)}/audio"></audio>
      ${flags||topics?`<div class="vtags">${flags} ${topics}${src?` <span class="muted" style="font-size:.72rem">${src}</span>`:''}</div>`:''}
      ${t.summary?`<div class="txt"><b>Summary:</b> ${esc(t.summary)}</div>`:''}
      <div class="txt ${n.transcript?'':'muted'}">${n.transcript?'“'+esc(n.transcript)+'”':'No transcript: recorded on a phone or in a browser without speech recognition. Listen to review.'}</div>
    </div>`;
  };
  $('#main').innerHTML=`<div class="card anim" style="margin-top:0">
  <h2>🎙️ Voice notes <span class="sub">${num(r.matched)} shown · ${num(r.total)} stored · ${num(r.flagged)} flagged · friends only, unsent ones are deleted${r.ai?' · AI tagging on':' · keyword tagging (set ANTHROPIC_API_KEY for AI tags)'}</span></h2>
  <div class="searchbar">
    <input id="vnQ" placeholder="Search by username, topic, flag or words said…" value="${esc(vnQ)}">
    <button class="btn" id="vnQBtn">Search</button>
  </div>
  <div class="tbar">
    <div class="seg">
      <button data-vs="recent" class="${vnSort==='recent'?'on':''}">Recent</button>
      <button data-vs="risk" class="${vnSort==='risk'?'on':''}">Needs review</button>
    </div>
    <div class="seg"><button id="vnFlagBtn" class="${vnFlagged?'on':''}">⚑ Flagged only (${num(r.flagged)})</button></div>
    ${vnQ?'<button class="lnk" id="vnClear">Clear search</button>':''}
  </div>
  <div class="feed">${r.notes.map(note).join('')||`<div class="muted">${vnQ||vnFlagged?'No voice notes match.':'No voice notes yet.'}</div>`}</div>
  </div>`;
  const go=()=>{vnQ=$('#vnQ').value.trim();load();};
  $('#vnQBtn').onclick=go;
  $('#vnQ').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.querySelectorAll('[data-vs]').forEach(b=>b.onclick=()=>{vnSort=b.dataset.vs;load();});
  $('#vnFlagBtn').onclick=()=>{vnFlagged=!vnFlagged;load();};
  const cl=$('#vnClear');if(cl)cl.onclick=()=>{vnQ='';load();};
  /* One clip at a time. */
  document.querySelectorAll('#main audio').forEach(a=>a.addEventListener('play',()=>{
    document.querySelectorAll('#main audio').forEach(o=>{if(o!==a)o.pause();});
  }));
}

    }catch(e){toast('Could not change maintenance mode',e.message,'bad');}
  };
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.themeSet;
    try{localStorage.setItem('tl_theme',t);}catch(e){}
    applyTheme(t);viewSettings();
  });
}

window.go=go;
window.load=load;
boot();
</script>
</body>
</html>
