<meta charset="utf-8">

<title>TalkLive - Owner Dashboard</title>
<style>
:root{
  --bg-1:#0b0f1a;--bg-2:#111729;--bg-glow:#1c2240;
  --accent:#6c5ce7;--accent-2:#00d4ff;--danger:#ff5470;
  --text:#f2f4ff;--muted:#8a90a8;--ink2:#b9bed4;
  --surface:rgba(255,255,255,.045);--surface-2:rgba(255,255,255,.08);
  --ring:rgba(255,255,255,.09);--grid:rgba(255,255,255,.07);
  --good:#2ee6a8;--warn:#ffc555;--serious:#ff9e6d;--crit:#ff5470;
  --s1:#00d4ff;--s2:#2ee6a8;--s3:#ffc555;--s5:#a29bfe;
  --grad:linear-gradient(135deg,var(--accent),var(--accent-2));
}
/* Light palette, defined once and applied from two places: the OS setting
   (unless the owner explicitly picked dark) and an explicit light choice. */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg-1:#eef1f9;--bg-2:#ffffff;--bg-glow:#dde4f5;
  --text:#1a2033;--muted:#5a617a;--ink2:#3c4360;
  --surface:rgba(255,255,255,.72);--surface-2:rgba(26,32,51,.05);
  --ring:rgba(26,32,51,.10);--grid:rgba(26,32,51,.09);
  --accent-2:#0086b3;--s1:#0086b3;--s2:#0e9e6e;--s3:#b57f00;--good:#0e9e6e;--warn:#b57f00;
}}
:root[data-theme="light"]{
  --bg-1:#eef1f9;--bg-2:#ffffff;--bg-glow:#dde4f5;
  --text:#1a2033;--muted:#5a617a;--ink2:#3c4360;
  --surface:rgba(255,255,255,.72);--surface-2:rgba(26,32,51,.05);
  --ring:rgba(26,32,51,.10);--grid:rgba(26,32,51,.09);
  --accent-2:#0086b3;--s1:#0086b3;--s2:#0e9e6e;--s3:#b57f00;--good:#0e9e6e;--warn:#b57f00;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;min-height:100dvh;
  background:radial-gradient(circle at 50% -10%,var(--bg-glow) 0%,var(--bg-1) 55%);background-attachment:fixed}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--ring);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.pwWrap{position:relative}
.pwWrap input{padding-right:44px}
.pwEye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--muted);border-radius:8px}
.pwEye:hover{color:var(--text)}
.pwEye .slash{display:none}
.pwEye.on .slash{display:inline}
.hidden{display:none!important}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px}

/* entrance animations */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.4}}
@keyframes glowmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.anim{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
.anim:nth-child(2){animation-delay:.04s}.anim:nth-child(3){animation-delay:.08s}.anim:nth-child(4){animation-delay:.12s}
.anim:nth-child(5){animation-delay:.16s}.anim:nth-child(6){animation-delay:.2s}.anim:nth-child(7){animation-delay:.24s}.anim:nth-child(8){animation-delay:.28s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* A refresh of the section already on screen repaints in place, without
   replaying the entrance animation. */
.quiet .anim{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;padding:28px 4px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--ring);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}

/* auth */
.auth{width:min(400px,calc(100% - 32px));margin:8vh auto;padding:30px 28px;background:var(--surface);backdrop-filter:blur(18px);border:1px solid var(--ring);border-radius:22px;animation:pop .4s ease both}
.auth .logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.auth h1{font-size:1.25rem}
.auth p{color:var(--ink2);font-size:.9rem;margin-bottom:14px;line-height:1.5}
.auth label{display:block;font-size:.78rem;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.auth .err{color:var(--crit);font-size:.85rem;margin-top:10px;min-height:1.2em}
.mark{width:34px;height:34px;display:block;flex:none;object-fit:contain}
.stbox{font-size:.82rem;border-radius:12px;padding:11px 13px;margin:12px 0;line-height:1.5}
.stbox.bad{background:color-mix(in srgb,var(--crit) 14%,transparent);border:1px solid var(--crit)}
.stbox.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn)}
.stbox b{display:block;margin-bottom:4px}
.stbox code{font-family:ui-monospace,monospace;font-size:.76rem;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.btn{background:var(--grad);color:#fff;border:0;border-radius:12px;padding:12px 16px;width:100%;font-weight:700;margin-top:16px;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(108,92,231,.35)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(108,92,231,.5)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--ring);width:auto;padding:7px 14px;margin:0;box-shadow:none}
.qrbox{text-align:center;margin:14px 0}.qrbox img{border-radius:10px;background:#fff;padding:6px}
.secret{font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-all;color:var(--ink2);background:var(--surface-2);padding:8px;border-radius:8px;margin-top:6px}

/* shell: sticky header on top, grouped sidebar on the left, content on the right */
header{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--grid);position:sticky;top:0;z-index:10;
  background:color-mix(in srgb,var(--bg-1) 78%,transparent);backdrop-filter:blur(16px)}
header h1{font-size:1rem;display:flex;align-items:center;gap:9px;white-space:nowrap}
header h1 .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
header .spacer{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block;flex:none;animation:pulse 2s infinite;box-shadow:0 0 10px var(--good)}
.dot.off{background:var(--muted);box-shadow:none;animation:none}
.badge{background:var(--crit);color:#fff;border-radius:9px;font-size:.66rem;padding:1px 6px;margin-left:5px;font-weight:700;vertical-align:1px}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);height:calc(100dvh - 56px);overflow-y:auto;padding:10px 10px 24px;border-right:1px solid var(--grid)}
.side .grp{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 5px;font-weight:700}
.side .grp:first-child{padding-top:6px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:var(--ink2);padding:8px 10px;border-radius:10px;font-size:.86rem;transition:background .15s,color .15s}
.side button .ic{width:20px;text-align:center;flex:none}
.side button:hover{background:var(--surface-2);color:var(--text)}
.side button.on{background:var(--surface-2);color:var(--text);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.side .badge{margin-left:auto}
main{padding:18px 22px;min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
@media(min-width:761px){main{padding-bottom:32px}}
@media(max-width:1000px) and (min-width:761px){.shell{grid-template-columns:180px minmax(0,1fr)}}
.phead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:9px}
.phead .crumb{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.phead .stamp{margin-left:auto;font-size:.74rem;color:var(--muted)}

/* realtime "people chatting" pill in the header */
.livepill{display:flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent);color:var(--text);border-radius:99px;padding:6px 13px;font-size:.84rem;white-space:nowrap;transition:border-color .15s}
.livepill:hover{border-color:var(--good)}
.livepill b{font-variant-numeric:tabular-nums;font-size:.95rem}
.livepill .lpsub{color:var(--muted)}
.livepill.stale{border-color:var(--ring);background:var(--surface-2)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.bump{display:inline-block;animation:bump .45s ease}

/* live card */
.livecard .lgrid{display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(auto-fit,minmax(120px,1fr));gap:10px}
.livecard .lbox{background:var(--surface-2);border:1px solid var(--ring);border-radius:14px;padding:12px 14px}
.livecard .lbox .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.livecard .lbox .v{font-size:1.6rem;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.livecard .lbox .s{font-size:.74rem;color:var(--ink2);margin-top:2px}
.livecard .lbox.big{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.livecard .lbox.big .v{font-size:2.6rem;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.splitbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface);margin-top:8px}
.splitbar i{display:block;height:100%;transition:width .6s ease}
.spark{margin-top:12px}
.sechead{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:22px 2px 8px}

/* mobile bottom nav */
.tabbar{display:none}
@media(max-width:760px){
  .shell{display:block}
  .side{display:none}
  header{gap:6px;padding-left:12px;padding-right:12px}
  header h1 .grad-text{display:none}
  .livepill .lpsub{display:none}
  .livecard .lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .livecard .lbox.big{grid-column:1/-1}
  #helpBtn{display:none}
  #searchBtn{margin-left:auto}
  header .btn.ghost{padding:7px 10px;font-size:.8rem}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;justify-content:space-around;
    background:color-mix(in srgb,var(--bg-1) 82%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--grid);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{background:transparent;border:0;color:var(--muted);font-size:.62rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;border-radius:12px;min-width:52px;position:relative}
  .tabbar button .ic{font-size:1.25rem;line-height:1;transition:transform .18s}
  .tabbar button.on{color:var(--text);font-weight:700}
  .tabbar button.on .ic{transform:translateY(-2px) scale(1.12)}
  .tabbar .badge{position:absolute;top:0;right:4px;margin:0}
  .tabbar button{min-height:48px;flex:1 1 0;min-width:0}
  /* Blurring the page behind every card is what made scrolling stutter on
     phones; over a flat background it bought nothing visible. */
  .tile,.card,header,.tabbar{backdrop-filter:none}
  header,.tabbar{background:var(--bg-1)}
  body{background-attachment:scroll}
  /* Theme lives in Settings on a phone; the header has no room for it. */
  #themeBtn{display:none}
  header .hbtn{padding:9px 10px}
  /* Anything under 16px makes iOS zoom into the field on focus. */
  input,select,textarea{font-size:16px!important}
  .rowbtns button,.seg button,.tzbar button,.lnk{min-height:38px}
  .rowbtns button{padding:7px 13px;font-size:.82rem}
  .lnk{display:inline-flex;align-items:center}
  .tbar input,.tbar select{min-width:0;flex:1 1 150px}
  .tbar .seg{flex:1 1 100%}
  .tbar .seg button{flex:1 0 auto}
  .tzbar button{flex:1 1 auto}
  .tzbar select,.tzbar input{min-width:0;width:100%!important;flex:1 1 100%}
  .tzbar span[style*="margin-left"]{margin-left:0!important}
  .searchbar{max-width:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:12px 13px}
  .tile:hover{transform:none}
  .card{padding:14px 13px;border-radius:16px}
  .card h2 span[style*="margin-left:auto"]{margin-left:0!important}
  .phead{margin-bottom:10px}
  .phead .stamp{margin-left:0;flex-basis:100%}
  .overlay{padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
  .sheet{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
  .sitem{padding:12px 16px}
  .cvlist,.cvthread{height:calc(100dvh - 300px);min-height:360px}
  .cvb{max-width:86%}
}

/* cards & tiles */
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.tile{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--ring);border-radius:18px;padding:14px 16px;transition:transform .18s,border-color .18s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--grad);opacity:0;transition:opacity .18s}
.tile:hover::before{opacity:1}
.tile .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:1.75rem;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .v.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .s{font-size:.76rem;color:var(--ink2);margin-top:3px}
.card{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--ring);border-radius:18px;padding:16px;margin-top:12px;overflow-x:auto}
.card h2{font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:.78rem}
.legend{display:flex;gap:14px;font-size:.76rem;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:560px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--grid)}
td{padding:9px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.ipcell{min-width:120px;max-width:170px;word-break:break-all;font-size:.78rem}
.pill{display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:99px;font-weight:700}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.pill.info{background:color-mix(in srgb,var(--s1) 15%,transparent);color:var(--s1)}
.muted{color:var(--muted);font-size:.83rem}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.rowbtns button{border:1px solid var(--ring);background:var(--surface-2);color:var(--text);border-radius:9px;padding:4px 11px;font-size:.77rem;transition:border-color .15s}
.rowbtns button:hover{border-color:var(--accent)}
.rowbtns button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:700}
.rowbtns button.danger{border-color:color-mix(in srgb,var(--crit) 45%,transparent);color:var(--crit)}
.rowbtns button.warnb{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.rowbtns button:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border:1px solid var(--ring);border-radius:99px;padding:4px 13px;font-size:.82rem;color:var(--ink2)}
.tooltip{position:fixed;pointer-events:none;background:var(--bg-2);color:var(--text);border:1px solid var(--ring);font-size:.75rem;padding:6px 9px;border-radius:9px;z-index:20;white-space:nowrap;transform:translate(-50%,-130%);box-shadow:0 6px 20px rgba(0,0,0,.35)}

/* feature ranking */
.rankrow{display:grid;grid-template-columns:38px minmax(90px,150px) 1fr 58px;align-items:center;gap:10px;margin:8px 0;font-size:.85rem}
.rankrow .medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--surface-2);color:var(--muted)}
.rankrow:nth-child(1) .medal{background:linear-gradient(135deg,#ffd76a,#e6a817);color:#4d3a00}
.rankrow:nth-child(2) .medal{background:linear-gradient(135deg,#e8ecf5,#a9b2c4);color:#39404f}
.rankrow:nth-child(3) .medal{background:linear-gradient(135deg,#f0b183,#b96b32);color:#4b2708}
.rankrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rankrow .bar{height:20px;border-radius:99px;background:var(--grad);min-width:3px;transition:width .8s cubic-bezier(.2,.7,.3,1);box-shadow:0 2px 10px rgba(108,92,231,.3)}
.rankrow .n{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:.8rem}
.stack{display:flex;gap:2px;height:22px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%;min-width:3px;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.scols{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--grid)}
.scol{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.sfill{width:100%;display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px}
.sfill i{display:block;min-height:2px}
table.heat{min-width:480px}table.heat td.num{border-radius:6px}
.hrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 58px;align-items:center;gap:10px;margin:7px 0;font-size:.84rem}
.hrow .hbar{height:18px;border-radius:99px;min-width:3px;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.hrow .n{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.hrow div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* activity report */
.tzbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.83rem;color:var(--ink2)}
.tzbar select{width:auto;min-width:200px;padding:7px 10px}
.tzbar button{border:1px solid var(--ring);background:var(--surface-2);color:var(--text);border-radius:9px;padding:7px 13px;font-size:.8rem}
.tzbar button:hover{border-color:var(--accent)}
.window{font-size:.78rem;color:var(--muted);margin-top:2px}
.delta{font-weight:700;font-size:.76rem}
.delta.up{color:var(--good)}.delta.down{color:var(--crit)}.delta.flat{color:var(--muted)}
/* 24-hour columns: one bar per local hour of the day */
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:150px;margin-top:6px}
.hours .hcol{position:relative;height:100%;display:flex;align-items:flex-end}
.hours .hfill{width:100%;border-radius:4px 4px 0 0;background:var(--grad);min-height:2px;transition:height .6s cubic-bezier(.2,.7,.3,1)}
.hours .hcol.future .hfill{background:var(--surface-2)}
.hours .hcol.now .hfill{background:linear-gradient(180deg,var(--s2),var(--good))}
.hourlbl{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;font-size:.6rem;color:var(--muted);text-align:center;margin-top:5px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cmp .box{background:var(--surface-2);border:1px solid var(--ring);border-radius:14px;padding:11px 13px}
.cmp .box .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cmp .box .v{font-size:1.35rem;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.cmp .box .s{font-size:.74rem;color:var(--ink2);margin-top:2px}

/* AI bot */
.bot{display:flex;flex-direction:column;gap:12px;max-width:860px;margin:0 auto}
.botcard{display:flex;flex-direction:column;padding-bottom:14px}
.bothead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ring)}
.bothead .sub{font-size:.78rem;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.bothead .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.bothead .dot.good{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.avatar.big{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;font-size:1.25rem;box-shadow:0 3px 12px rgba(108,92,231,.4)}
.ghostbtn{background:var(--surface-2);border:1px solid var(--ring);color:var(--ink2);border-radius:99px;padding:7px 13px;font-size:.8rem;white-space:nowrap}
.ghostbtn:hover{border-color:var(--accent);color:var(--text)}
.botnote{margin-top:12px;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 13px;font-size:.84rem;line-height:1.55}
.botscroll{height:min(62vh,640px);min-height:320px;overflow-y:auto;padding:14px 2px 6px;overscroll-behavior:contain}
.botempty{text-align:center;padding:26px 8px 10px}
.botempty .big{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.botempty .muted{font-size:.86rem;max-width:520px;margin:0 auto}
.suggest{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:18px;text-align:left}
.suggest button{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--ring);color:var(--ink2);border-radius:14px;padding:11px 13px;font-size:.84rem;line-height:1.4;text-align:left;transition:border-color .15s,color .15s,transform .15s}
.suggest button:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px)}
.botlog{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;animation:rise .35s ease both;align-items:flex-start}
.msg .avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;font-size:.95rem;box-shadow:0 3px 12px rgba(108,92,231,.4)}
.msg .bubble{background:var(--surface);border:1px solid var(--ring);border-radius:18px 18px 18px 5px;padding:11px 15px;font-size:.9rem;line-height:1.6;max-width:88%;min-width:0;overflow-wrap:anywhere}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:var(--grad);color:#fff;border:0;border-radius:18px 18px 5px 18px;white-space:pre-wrap}
.msg .bubble b{color:var(--text);font-weight:750}.msg.me .bubble b{color:#fff}
.md p{margin:0 0 .6em}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:.2em 0 .7em;padding-left:1.3em}.md li{margin:.18em 0}.md li.sub{margin-left:1.1em;list-style:circle}
.md .mdh{font-weight:800;margin:.8em 0 .35em;color:var(--text)}.md .mdh:first-child{margin-top:0}
.md .mdh.h1,.md .mdh.h2{font-size:1.02rem}.md .mdh.h3,.md .mdh.h4{font-size:.93rem;color:var(--accent-2)}
.md code{background:var(--surface-2);border:1px solid var(--ring);border-radius:6px;padding:0 5px;font-size:.84em}
.md pre{background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;padding:10px;overflow-x:auto;font-size:.8rem}.md pre code{border:0;padding:0;background:none}
.md hr{border:0;border-top:1px solid var(--ring);margin:.8em 0}
.mdtable{overflow-x:auto;margin:.3em 0 .8em;border:1px solid var(--ring);border-radius:10px}
.mdtable table{border-collapse:collapse;width:100%;font-size:.82rem}
.mdtable th,.mdtable td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--ring);white-space:nowrap}
.mdtable th{background:var(--surface-2);font-weight:700;color:var(--ink2)}.mdtable tr:last-child td{border-bottom:0}
.botsteps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.botsteps .step{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--ring);border-radius:99px;padding:3px 10px}
.botsteps .step.on{color:var(--text);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.botsteps .spin{width:11px;height:11px;border-width:2px}
.boterr{color:var(--crit);font-size:.84rem;margin-top:4px}
.botconfirm{margin-top:10px;border:1px solid var(--ring);border-radius:14px;padding:10px 12px;background:var(--surface-2)}
.botconfirm.open{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--surface-2))}
.botconfirm .ct{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-bottom:6px}
.botconfirm .act{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--ring);font-size:.86rem;line-height:1.45;cursor:pointer}
.botconfirm .act:first-of-type{border-top:0}
.botconfirm .act input{width:16px;height:16px;min-width:0;padding:0;margin:3px 0 0;accent-color:var(--accent);flex:none}
.botconfirm .atag{flex:none;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:2px 6px;margin-top:1px}
.botconfirm .asum{flex:1;min-width:0;overflow-wrap:anywhere}
.botconfirm .aerr{display:block;color:var(--crit);font-size:.78rem;margin-top:2px}
.botconfirm .ast{flex:none}
.botconfirm .cbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.botconfirm .cbtns button{border-radius:99px;padding:7px 15px;font-size:.84rem;border:1px solid var(--ring);background:var(--surface);color:var(--text);cursor:pointer}
.botconfirm .cbtns .approve{background:var(--grad);border:0;color:#fff;font-weight:700}
.botacts{display:flex;gap:6px;margin-top:8px}
.botacts button{background:none;border:0;color:var(--muted);font-size:.74rem;padding:2px 4px;cursor:pointer}.botacts button:hover{color:var(--text)}
.botinput{display:flex;gap:8px;align-items:flex-end;margin-top:10px;background:var(--surface-2);border:1px solid var(--ring);border-radius:18px;padding:6px 6px 6px 14px;transition:border-color .15s}
.botinput:focus-within{border-color:var(--accent)}
.botinput textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:.92rem;line-height:1.45;padding:7px 0;max-height:180px;min-width:0}
.sendbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-size:1.05rem;font-weight:800;flex:none;cursor:pointer}
.bothint{font-size:.72rem;margin-top:6px;text-align:center}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:typing 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.quickq{display:flex;flex-wrap:wrap;gap:8px}
.quickq button{background:var(--surface-2);border:1px solid var(--ring);color:var(--ink2);border-radius:99px;padding:7px 14px;font-size:.82rem;transition:border-color .15s,color .15s}
.quickq button:hover{border-color:var(--accent);color:var(--text)}
@media (max-width:600px){.bothead h2{font-size:1rem}.msg .bubble{max-width:100%}.botscroll{height:58vh}.suggest{grid-template-columns:1fr}}

/* chat feed */
.feed{display:flex;flex-direction:column;gap:8px}
.fmsg{background:var(--surface-2);border:1px solid var(--ring);border-radius:14px;padding:10px 13px;animation:rise .3s ease both}
.fmsg .top{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;color:var(--muted);margin-bottom:4px;flex-wrap:wrap;align-items:center}
.fmsg .top b{color:var(--text);font-size:.85rem}
.fmsg .txt{font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}
.searchbar{display:flex;gap:8px;margin-bottom:12px;max-width:460px}
.searchbar .btn{width:auto;margin:0;padding:9px 16px}

/* --- conversation reader -----------------------------------------------------
   Two panes: a scannable list of conversations on the left, the thread you
   picked on the right. Both scroll independently inside a fixed height, so the
   page itself never grows - the whole point is that you can work straight down
   the list without losing your place. Below 1000px it collapses to one pane at
   a time, list then thread. */
.cvwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
.cvlist,.cvthread{height:min(68vh,640px);overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--ring);border-radius:14px;background:var(--surface-2)}
.cvlist{padding:6px}
.cvrow{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:9px 10px;border-radius:11px;transition:background .12s ease}
.cvrow+.cvrow{margin-top:2px}
.cvrow:hover{background:var(--surface-2)}
.cvrow.on{background:color-mix(in srgb,var(--accent) 22%,transparent);outline:1px solid var(--accent)}
.cvrow .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.86rem;font-weight:700;margin-bottom:3px}
.cvrow .prev{font-size:.79rem;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cvrow .meta{margin-top:4px;font-size:.71rem;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}
.cvempty{padding:26px 16px;text-align:center;color:var(--muted);font-size:.85rem}

.cvthead{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
  padding:11px 14px;border-bottom:1px solid var(--ring);background:var(--surface-2);backdrop-filter:blur(10px)}
.cvthead h3{margin:0;font-size:.95rem}
.cvthead .sub{display:block;font-weight:400;font-size:.74rem;color:var(--muted);margin-top:3px}
.cvthead .rowbtns{margin-left:auto}
.cvback{display:none}

.cvbody{display:flex;flex-direction:column;gap:3px;padding:12px 14px 18px}
/* Bubbles are aligned by side, not by who is "me" - in a transcript neither
   party is the reader, so the left/right split is simply "first speaker" vs
   "the other one", held stable for the whole thread. */
.cvb{max-width:74%;padding:7px 11px;border-radius:13px;font-size:.87rem;line-height:1.45;overflow-wrap:anywhere;position:relative}
.cvb.a{align-self:flex-start;background:var(--surface);border:1px solid var(--ring);border-bottom-left-radius:4px}
.cvb.b{align-self:flex-end;background:color-mix(in srgb,var(--accent) 26%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-bottom-right-radius:4px}
.cvb.risk{box-shadow:inset 3px 0 0 var(--crit)}
.cvb .t{display:block;font-size:.66rem;color:var(--muted);margin-top:3px}
.cvb .q{display:block;font-size:.72rem;color:var(--muted);border-left:2px solid var(--muted);padding-left:6px;margin-bottom:4px;opacity:.85}
.cvname{font-size:.7rem;color:var(--muted);margin:9px 0 1px;font-weight:700;letter-spacing:.02em}
.cvname.b{align-self:flex-end}
.cvgap{align-self:center;font-size:.68rem;color:var(--muted);padding:6px 0}
.cvflags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

/* Flag chips: one colour family for "look now", one for context. */
.fl{font-size:.63rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;border:1px solid currentColor}
.fl.minor,.fl.sexual,.fl.abuse{color:var(--crit)}
.fl.contact,.fl.link,.fl.money{color:var(--warn)}

@media (max-width:1000px){
  .cvwrap{grid-template-columns:1fr}
  .cvwrap.reading .cvlist{display:none}
  .cvwrap:not(.reading) .cvthread{display:none}
  .cvlist,.cvthread{height:min(72vh,620px)}
  .cvback{display:inline-flex}
}

.concl{position:relative;overflow:hidden}
.concl::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent));background-size:200% 100%;animation:glowmove 4s linear infinite}
.concl li{margin:7px 0 7px 16px;line-height:1.6;color:var(--ink2)}
.switch{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* header controls */
.hbtn{background:transparent;border:1px solid var(--ring);color:var(--ink2);border-radius:10px;padding:7px 10px;font-size:.82rem;line-height:1;transition:border-color .15s,color .15s}
.hbtn:hover{border-color:var(--accent);color:var(--text)}
.hbtn.live{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.hbtn.paused{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.searchbtn{flex:none;display:flex;align-items:center;gap:7px;color:var(--muted)}
.searchbtn kbd{border:1px solid var(--ring);border-radius:5px;padding:1px 5px;font-size:.68rem;font-family:inherit;background:var(--surface-2)}
@media(max-width:900px){.searchbtn span.lbl,.hbtn span.lbl{display:none}.searchbtn kbd{display:none}}

/* toasts */
.toasts{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 28px))}
@media(min-width:761px){.toasts{bottom:18px}}
.toast{background:var(--bg-2);border:1px solid var(--ring);border-left:3px solid var(--accent);border-radius:12px;padding:10px 13px;font-size:.84rem;color:var(--text);box-shadow:0 8px 26px rgba(0,0,0,.35);animation:pop .25s ease both}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--crit)}.toast.warn{border-left-color:var(--warn)}
.toast b{display:block;margin-bottom:2px;font-size:.8rem}
.toast .tx{color:var(--ink2);font-size:.79rem}

/* modal / command palette */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,7,16,.62);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:10vh 14px 14px}
.overlay.mid{align-items:center;padding:14px}
.sheet{background:var(--bg-2);border:1px solid var(--ring);border-radius:18px;width:100%;max-width:560px;max-height:78vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:pop .2s ease both}
.sheet .shead{padding:14px 16px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:700}
.sheet .shead .x{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:1.1rem;padding:2px 6px;border-radius:8px}
.sheet .shead .x:hover{color:var(--text);background:var(--surface-2)}
.sheet .sbody{padding:14px 16px}
.sheet label{display:block;font-size:.76rem;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.sheet label:first-child{margin-top:0}
.sres{padding:6px 0}
.sgroup{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 16px 4px}
.sitem{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:8px 16px;font-size:.85rem;border-left:2px solid transparent}
.sitem:hover,.sitem.sel{background:var(--surface-2);border-left-color:var(--accent)}
.sitem .s2{display:block;color:var(--muted);font-size:.76rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbdlist{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.84rem;align-items:center}
.kbdlist kbd{border:1px solid var(--ring);background:var(--surface-2);border-radius:6px;padding:2px 7px;font-family:inherit;font-size:.76rem;justify-self:start}

/* toolbar above tables */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbar input,.tbar select{width:auto;min-width:170px;padding:8px 11px;font-size:.84rem}
.tbar .grow{flex:1;min-width:170px}
.seg{display:flex;gap:0;border:1px solid var(--ring);border-radius:10px;overflow-x:auto;max-width:100%}
.seg button{background:transparent;border:0;color:var(--muted);padding:7px 12px;font-size:.8rem;white-space:nowrap}
.seg button.on{background:var(--surface-2);color:var(--text);font-weight:700}
.lnk{color:var(--accent-2);text-decoration:none;font-size:.8rem;border:1px solid var(--ring);border-radius:10px;padding:7px 12px;white-space:nowrap}
.lnk:hover{border-color:var(--accent)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th.sortable .ar{opacity:.5;font-size:.7rem}

/* country breakdown (accounts tab) */
.crow{display:grid;grid-template-columns:26px minmax(100px,180px) 1fr 96px;align-items:center;gap:10px;margin:8px 0;font-size:.85rem}
.crow .rk{color:var(--muted);font-size:.72rem;text-align:right;font-variant-numeric:tabular-nums}
.crow .cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.crow .cbar{height:20px;border-radius:99px;min-width:3px;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.crow .cn{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:.8rem}
.crow .cn b{color:var(--text)}
@media(max-width:640px){.crow{grid-template-columns:22px minmax(72px,110px) 1fr 80px;gap:7px;font-size:.8rem}}

/* Tables become one card per row on a phone: each cell is labelled with its
   column (set by stackTables()), so nothing needs sideways scrolling. */
@media(max-width:640px){
  table.stk{min-width:0}
  table.stk,table.stk tbody,table.stk tr,table.stk td{display:block;width:100%}
  table.stk tr.hdr{display:none}
  table.stk tr.hdr.sorts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  table.stk tr.hdr.sorts th{width:auto;border:1px solid var(--ring);border-radius:99px;padding:6px 11px;background:var(--surface-2)}
  table.stk tr.hdr.sorts th:empty{display:none}
  table.stk tr:not(.hdr){border:1px solid var(--ring);border-radius:14px;background:var(--surface-2);padding:6px 12px;margin-bottom:8px}
  table.stk td{border:0;padding:6px 0;text-align:right;display:flow-root;overflow-wrap:anywhere}
  table.stk td+td{border-top:1px solid var(--grid)}
  table.stk td[data-label]::before{content:attr(data-label);float:left;margin-right:12px;max-width:45%;text-align:left;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  table.stk td:not([data-label]),table.stk td[colspan]{text-align:left}
  table.stk td .rowbtns{justify-content:flex-end}
  table.stk td:not([data-label]) .rowbtns{justify-content:flex-start}
  table.stk td:empty{display:none}
  table.stk tr.accdetail td>div>div{min-width:0!important}
  .hrow[style]{grid-template-columns:minmax(78px,38%) 1fr auto!important}
  .hrow .n{white-space:nowrap}
}

@media(max-width:640px){
  main{padding:12px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .tile .v{font-size:1.45rem}
  .rankrow{grid-template-columns:30px minmax(70px,105px) 1fr 48px}
  .hrow{grid-template-columns:minmax(70px,105px) 1fr 48px}
  .msg .bubble{max-width:92%}
}
.vnote audio{display:block;width:100%;max-width:420px;height:36px;margin:8px 0 6px}
.vnote .vtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.vnote.vsev{border-left:3px solid var(--crit)}
</style>

<body>

<div id="setupView" class="auth hidden">

  <div id="setupStep1">

<script>
'use strict';
const $=(s)=>document.querySelector(s);
const api=async(p,opt)=>{const r=await fetch('/owner/api/'+p,{headers:{'Content-Type':'application/json'},...opt});if(r.status===401&&p!=='login'){clearInterval(timer);show('login');throw new Error('auth');}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j;};
const post=(p,body)=>api(p,{method:'POST',body:JSON.stringify(body||{})});
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* For values placed inside a single-quoted JS string within an inline onclick=
   attribute. HTML-escaping alone is NOT enough there: the browser HTML-decodes
   the attribute before the JS parser runs, so an escaped quote turns back into a
   real quote and breaks out. Unicode-escaping every non-alphanumeric character
   survives HTML decoding intact and can never terminate the string or attribute. */
const jsq=(s)=>String(s==null?'':s).replace(/[^A-Za-z0-9]/g,c=>{const h=c.charCodeAt(0);return h<256?'\\x'+h.toString(16).padStart(2,'0'):'\\u'+h.toString(16).padStart(4,'0');});
const fmtTs=(ts)=>new Date(ts).toLocaleString();
const ago=(ts)=>{const m=Math.round((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+'m ago';if(m<1440)return Math.round(m/60)+'h ago';return Math.round(m/1440)+'d ago';};
/* Time left until a future moment. ago() only reads the past: fed a ban's
   expiry it rounded every future time down to "just now". */
const until=(ts)=>{const m=Math.round((ts-Date.now())/60000);if(m<1)return'any moment';if(m<60)return'in '+m+'m';if(m<1440)return'in '+Math.round(m/60)+'h';return'in '+Math.round(m/1440)+'d';};
const num=(n)=>Number(n||0).toLocaleString();
/* Share of a total, rounded to one decimal below 10% so small countries don't all read as 0%. */
const pctOf=(v,t)=>{if(!t)return'0%';const p=v/t*100;return(p<10?p.toFixed(1):Math.round(p))+'%';};
/* Percent change vs a baseline. null means "no baseline" (the comparison
   period was empty), which is not the same as 0% and must not read as flat. */
const deltaHtml=(pct)=>pct===null||pct===undefined?'<span class="delta flat">no baseline</span>'
  :`<span class="delta ${pct>0?'up':pct<0?'down':'flat'}">${pct>0?'▲':pct<0?'▼':'▬'} ${Math.abs(pct)}%</span>`;

/* ---------- toasts, modal, theme ---------- */
function toast(title,text,kind){
  const box=$('#toasts');if(!box)return;
  const el=document.createElement('div');
  el.className='toast '+(kind||'');
  el.innerHTML=`<b>${esc(title)}</b>${text?`<span class="tx">${esc(text)}</span>`:''}`;
  box.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),320);},kind==='bad'?6000:3600);
}
/* One overlay at a time. `onOpen` receives the sheet so a caller can wire its
   own inputs; Escape and a click on the backdrop always close it. */
let overlayEl=null;
function closeModal(){if(overlayEl){overlayEl.remove();overlayEl=null;}}
function modal(title,bodyHtml,onOpen,opts){
  closeModal();
  const o=document.createElement('div');
  o.className='overlay'+((opts&&opts.mid)?' mid':'');
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="shead">${title}<button class="x" aria-label="Close">✕</button></div><div class="sbody">${bodyHtml}</div></div>`;
  o.addEventListener('mousedown',(e)=>{if(e.target===o)closeModal();});
  o.querySelector('.x').onclick=closeModal;
  document.body.appendChild(o);
  overlayEl=o;
  if(onOpen)onOpen(o.querySelector('.sheet'));
  return o;
}
const THEMES=['auto','dark','light'];
function applyTheme(t){
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  const b=$('#themeBtn');if(b)b.textContent=t==='dark'?'🌙':t==='light'?'☀️':'🌗';
}
function currentTheme(){try{return localStorage.getItem('tl_theme')||'auto';}catch(e){return 'auto';}}
function cycleTheme(){
  const next=THEMES[(THEMES.indexOf(currentTheme())+1)%THEMES.length];
  try{localStorage.setItem('tl_theme',next);}catch(e){}
  applyTheme(next);
  toast('Theme: '+next,next==='auto'?'Follows your system setting.':'');
}
applyTheme(currentTheme());

function show(view){
  $('#setupView').classList.toggle('hidden',view!=='setup');
  $('#loginView').classList.toggle('hidden',view!=='login');
  $('#dash').classList.toggle('hidden',view!=='dash');
}

/* animated count-up for stat tiles */
function countUp(el,target){
  const t=Number(target)||0;
  if(t<=0||t>200000){el.textContent=num(t);return;}
  const dur=650,start=performance.now();
  const step=(now)=>{const p=Math.min(1,(now-start)/dur);el.textContent=num(Math.round(t*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function animateCounters(){document.querySelectorAll('[data-count]').forEach(el=>quiet?(el.textContent=num(el.dataset.count)):countUp(el,el.dataset.count));}

/* ---------- auth flow ---------- */
function renderStorage(storage){
  const s=storage||{};
  let html='';
  if(s.configured && s.atRisk){
    html=`<div class="stbox bad"><b>⚠️ Database not connected - data will be lost on restart</b>
      Your <code>DATABASE_URL</code> is set but the server could not connect to it, so it fell back to temporary storage. That is why your login keeps resetting. Fix the connection string with <code>fly secrets set DATABASE_URL=...</code> and redeploy.<br><br>
      Host tried: <code>${esc(s.host||'?')}</code><br>
      Error: <code>${esc(s.error||'unknown')}</code></div>`;
  } else if(s.ephemeral){
    // This box used to say the file store "lives on the Fly volume at /data and
    // survives deploys and restarts". No volume is mounted, so that was exactly
    // backwards: it reassured the owner while every account was being destroyed
    // on each push.
    html=`<div class="stbox bad"><b>⚠️ Stored data is deleted on every deploy</b>
      No <code>DATABASE_URL</code> is set, so the server is using its file store - and <code>${esc(s.dataDir||'/data')}</code> is not a mounted volume, just a directory inside the container. Accounts, bans, reports and this dashboard's own password are discarded every time the app deploys, which happens automatically on every push.<br><br>
      Fix: <code>fly secrets set DATABASE_URL=...</code> (the Supabase connection string) so the data lives in Postgres instead.</div>`;
  } else if(!s.configured){
    html=`<div class="stbox warn"><b>ℹ️ No database configured</b>Running on the file store at <code>${esc(s.dataDir||'/data')}</code>, which is a mounted volume and survives deploys and restarts. It is tied to this one machine and is not backed up, so set a <code>DATABASE_URL</code> (<code>fly secrets set DATABASE_URL=...</code>) if you want managed backups or plan to run more than one machine.</div>`;
  }
  const a=document.getElementById('setupStorage'),b=document.getElementById('loginStorage');
  if(a)a.innerHTML=html; if(b)b.innerHTML=html;
}
async function boot(){
  try{
    const st=await api('status');
    renderStorage(st.storage);
    if(!st.setupDone)show('setup');
    else if(st.authed){show('dash');startDash();}
    else show('login');
  }catch(e){show('login');}
}
$('#setupBtn').onclick=async()=>{
  const p=$('#setupPass').value,p2=$('#setupPass2').value;
  $('#setupErr').textContent='';
  if(p.length<10)return $('#setupErr').textContent='Password must be at least 10 characters.';
  if(p!==p2)return $('#setupErr').textContent='Passwords do not match.';
  try{
    const r=await post('setup',{password:p});
    $('#setupStep1').classList.add('hidden');$('#setupStep2').classList.remove('hidden');
    if(r.qr)$('#qrImg').src=r.qr;else $('#qrImg').remove();
    $('#secretText').textContent=r.secret;
  }catch(e){$('#setupErr').textContent=e.message;}
};
$('#setupConfirmBtn').onclick=async()=>{
  $('#setupErr').textContent='';
  try{await post('setup-confirm',{code:$('#setupCode').value});show('dash');startDash();}
  catch(e){$('#setupErr').textContent=e.message;}
};
$('#loginBtn').onclick=async()=>{
  $('#loginErr').textContent='';
  try{await post('login',{password:$('#loginPass').value,code:$('#loginCode').value});$('#loginPass').value='';$('#loginCode').value='';show('dash');startDash();}
  catch(e){$('#loginErr').textContent=e.message;}
};
document.querySelectorAll('.pwEye').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling,show=i.type==='password';i.type=show?'text':'password';b.classList.toggle('on',show);b.setAttribute('aria-label',show?'Hide password':'Show password');b.title=b.getAttribute('aria-label');i.focus();});
$('#loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginCode').focus();});
$('#loginCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});
$('#setupCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('#setupConfirmBtn').click();});
$('#logoutBtn').onclick=async()=>{try{await post('logout');}catch(e){}location.reload();};
$('#themeBtn').onclick=cycleTheme;
$('#helpBtn').onclick=openHelp;
$('#searchBtn').onclick=openSearch;
$('#refreshBtn').onclick=togglePause;
$('#livePill').onclick=()=>go('live');

/* Labels every data cell with its column heading so the phone layout can show
   each row as a card. Runs on every change to #main, so views never have to
   remember to call it. The gender x age grid stays a grid (it reads as one), and so do
   tables inside AI agent answers. */
function stackTables(){
  document.querySelectorAll('#main table:not(.heat):not(.stk):not(.mdt)').forEach(t=>{
    const rows=t.rows;if(!rows.length||!rows[0].querySelector('th'))return;
    const head=rows[0];
    const labels=[...head.cells].map(c=>c.textContent.replace(/[↕▲▼]/g,'').trim());
    head.classList.add('hdr');
    if(head.querySelector('th.sortable'))head.classList.add('sorts');
    for(let i=1;i<rows.length;i++){
      [...rows[i].cells].forEach((td,j)=>{if(td.colSpan===1&&labels[j])td.dataset.label=labels[j];});
    }
    t.classList.add('stk');
  });
}
new MutationObserver(stackTables).observe($('#main'),{childList:true,subtree:true});

/* ---------- charts (inline SVG) ---------- */
let tipEl=null;
function tip(show,x,y,html){
  if(!tipEl){tipEl=document.createElement('div');tipEl.className='tooltip hidden';document.body.appendChild(tipEl);}
  tipEl.classList.toggle('hidden',!show);
  if(show){
    tipEl.innerHTML=html;
    /* Centred on the finger/cursor, but never pushed off the side of a phone. */
    const w=tipEl.offsetWidth;
    tipEl.style.left=Math.min(Math.max(x,w/2+8),innerWidth-w/2-8)+'px';
    tipEl.style.top=Math.max(y,tipEl.offsetHeight*1.3+8)+'px';
  }
}
function lineChart(el,series,keys,colors,labels){
  const W=el.clientWidth||800,H=240,P={l:42,r:12,t:12,b:26};
  const max=Math.max(1,...series.flatMap(d=>keys.map(k=>d[k]||0)));
  const x=(i)=>P.l+(series.length<2?0:(i/(series.length-1))*(W-P.l-P.r));
  const y=(v)=>H-P.b-(v/max)*(H-P.t-P.b);
  const ticks=4;let g='';
  for(let t=0;t<=ticks;t++){const v=Math.round(max*t/ticks),yy=y(v);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;}
  let defs='',paths='';
  keys.forEach((k,ki)=>{
    const pts=series.map((d,i)=>`${x(i)},${y(d[k]||0)}`).join(' ');
    if(ki===0&&series.length>1){
      defs+=`<linearGradient id="area0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${colors[0]}" stop-opacity=".28"/><stop offset="100%" stop-color="${colors[0]}" stop-opacity="0"/></linearGradient>`;
      paths+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(series.length-1)},${y(0)}" fill="url(#area0)"/>`;
    }
    paths+=`<polyline points="${pts}" fill="none" stroke="${colors[ki]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  let lbls='';
  series.forEach((d,i)=>{if(i%Math.ceil(series.length/6)===0||i===series.length-1)lbls+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.day.slice(5)}</text>`;});
  el.innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block"><defs>${defs}</defs>${g}${paths}${lbls}<rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/></svg>`;
  const svg=el.querySelector('svg');
  svg.addEventListener('pointermove',(e)=>{
    const r=svg.getBoundingClientRect();
    const relX=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(series.length-1,Math.round((relX-P.l)/((W-P.l-P.r)/Math.max(1,series.length-1)))));
    const d=series[i];
    tip(true,e.clientX,e.clientY,`<b>${d.day}</b><br>`+keys.map((k,ki)=>`${labels[ki]}: ${num(d[k])}`).join('<br>'));
  });
  svg.addEventListener('pointerleave',()=>tip(false));
  svg.addEventListener('pointercancel',()=>tip(false));
}
function hbars(el,entries,color){
  const max=Math.max(1,...entries.map(e=>e[1]));
  el.innerHTML=entries.map(([name,v])=>`<div class="hrow"><div title="${esc(name)}">${esc(name)}</div><div><div class="hbar" style="width:${Math.max(1,v/max*100)}%;background:${color}"></div></div><div class="n">${num(v)}</div></div>`).join('')||'<div class="muted">No data yet.</div>';
}
/* Top five features as bars; the rest fold into one quiet line that expands
   on demand, so the card answers "what do people use?" at a glance. */
let featShowAll=false;
function rankedBars(el,entries){
  if(!entries.length){el.innerHTML='<div class="muted">No feature usage recorded yet.</div>';return;}
  const TOP=5;
  const max=Math.max(1,...entries.map(e=>e[1]));
  const total=entries.reduce((a,e)=>a+e[1],0);
  const rest=entries.slice(TOP);
  const row=([name,v],i)=>`<div class="rankrow">
    <div class="medal">${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</div>
    <div class="name" title="${esc(name)}">${esc(name)}</div>
    <div><div class="bar" style="width:${Math.max(2,v/max*100)}%${i>2?';opacity:.55':''}"></div></div>
    <div class="n" title="${pctOf(v,total)} of all feature use">${num(v)}</div></div>`;
  el.innerHTML=entries.slice(0,TOP).map(row).join('')
    +(rest.length?(featShowAll
      ?`<div style="opacity:.7;font-size:.9em">${rest.map((e,i)=>row(e,i+TOP)).join('')}</div>`
      :`<div class="muted" style="font-size:.78rem;margin-top:6px">+${rest.length} more: ${rest.map(([n,v])=>`${esc(n)} ${num(v)}`).join(' · ')}</div>`)
      +`<button class="lnk" id="featToggle" style="margin-top:8px;background:none;cursor:pointer">${featShowAll?'Show top 5':'Show all '+entries.length}</button>`:'');
  const t=el.querySelector('#featToggle');
  if(t)t.onclick=()=>{featShowAll=!featShowAll;rankedBars(el,entries);};
}

/* ---------- dashboard shell ---------- */
/* Sections are grouped by the job they serve, so the sidebar reads as
   "watch → act on people → understand users → money → the machine" instead of
   fourteen peers in a row. Shortcut keys 1-9 follow this order. */
const GROUPS=[
  ['Monitor',[['overview','Overview','📊'],['live','Live','🟢'],['activity','Activity','📅'],['experience','Experience','🩺'],['ai','AI Agent','🤖']]],
  ['Moderation',[['reports','Reports','🚩'],['chats','Chats','💬'],['voicenotes','Voice notes','🎙️'],['warnings','Warnings','⚠️'],['bans','Bans','⛔']]],
  ['People',[['audience','Audience','⚧'],['accounts','Accounts','👤'],['talktime','Talk time','⏱️'],['games','Games','🎮'],['feedback','Feedback','⭐']]],
  ['Business',[['revenue','Revenue','💎']]],
  ['System',[['errors','Errors','🐛'],['audit','Audit log','🧾'],['settings','Settings','🛠️']]]
];
const TABS=GROUPS.flatMap(g=>g[1]);
const TAB_IDS=TABS.map(t=>t[0]);
const groupOf=(id)=>(GROUPS.find(g=>g[1].some(t=>t[0]===id))||GROUPS[0])[0];
/* Four fit the bottom bar on a small phone; the fifth slot is a "More" sheet so
   every tab stays reachable from a phone instead of only these four. */
const MOBILE_TABS=['overview','live','chats','reports'];
let tab='overview',timer=null,counts={},paused=false,lastLoadTs=0,loadFailures=0;
/* loadSeq: every load() takes a number and only the newest may paint, so a slow
   answer for the tab you just left can never overwrite the one you opened.
   renderedTab: which tab #main currently shows (null while loading one).
   quiet: a repaint of the tab already on screen - no entrance animations and no
   counters re-counting from zero every 12 seconds. */
let loadSeq=0,renderedTab=null,quiet=false;
const REFRESH_MS=()=>tab==='live'?5000:tab==='ai'?60000:12000;

function navBadge(id){
  if(id==='reports'&&counts.unhandledReports)return `<span class="badge">${counts.unhandledReports}</span>`;
  if(id==='errors'&&counts.errors)return `<span class="badge" style="background:var(--serious)">${counts.errors}</span>`;
  return '';
}
/* Swapping the nav's DOM while a finger is on it swallows the tap (the button
   that got the touchstart is gone by the click), and the Overview poll used to
   rebuild it every 12s. So only write when the markup actually changed. */
function setHtml(el,html){if(el&&el._html!==html){el.innerHTML=html;el._html=html;}}
function renderNav(){
  setHtml($('#nav'),GROUPS.map(([g,items])=>`<div class="grp">${g}</div>`
    +items.map(([id,l,ic])=>`<button data-t="${id}" class="${tab===id?'on':''}"><span class="ic">${ic}</span>${l}${navBadge(id)}</button>`).join('')).join(''));
  const onMore=!MOBILE_TABS.includes(tab);
  const pending=(counts.unhandledReports||0)+(counts.errors||0);
  setHtml($('#tabbar'),MOBILE_TABS.map(id=>{const t=TABS.find(x=>x[0]===id);return `<button data-t="${id}" class="${tab===id?'on':''}"><span class="ic">${t[2]}</span>${t[1]}${navBadge(id)}</button>`;}).join('')
    +`<button data-more="1" class="${onMore?'on':''}"><span class="ic">⋯</span>More${!onMore&&pending?`<span class="badge">${pending}</span>`:''}</button>`);
  renderPageHead();
}
/* One listener each, attached once, so re-rendering the buttons never leaves
   them unwired. */
['#nav','#tabbar'].forEach(sel=>$(sel).addEventListener('click',(e)=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.more)openMore();else if(b.dataset.t)go(b.dataset.t);
}));

/* ---------- realtime: people chatting right now ----------
   The server pushes a frame over Server-Sent Events whenever the number of
   people in a voice call or text chat changes (checked every second). Anything
   on the page tagged data-live="<field>" is repainted from it, so the header
   pill, the Overview card and the Live tab all move together without waiting
   for the 12s poll. */
let liveES=null,live=null,liveOk=false,liveRetry=null,liveHist=[],livePeak=0;
const LIVE_HIST_MAX=300; // one sample every 2s → last 10 minutes
function startLiveStream(){
  if(liveES||typeof EventSource==='undefined')return;
  liveES=new EventSource('/owner/api/live/stream');
  liveES.onopen=()=>setLiveOk(true);
  liveES.onmessage=(e)=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}setLiveOk(true);onLive(d);};
  liveES.onerror=()=>{
    setLiveOk(false);
    /* A non-200 answer (logged out, too many tabs) closes the stream for good;
       a dropped connection is retried by the browser on its own. */
    if(liveES&&liveES.readyState===2){liveES=null;clearTimeout(liveRetry);liveRetry=setTimeout(startLiveStream,15000);}
  };
}
function setLiveOk(ok){
  if(liveOk===ok)return;
  liveOk=ok;
  const p=$('#livePill'),d=$('#lpDot');
  if(p)p.classList.toggle('stale',!ok);
  if(d)d.classList.toggle('off',!ok);
  const c=$('#liveConn');
  if(c){c.className='pill '+(ok?'good':'warn');c.textContent=ok?'● streaming':'reconnecting…';}
}
function onLive(d){
  const prev=live;
  live=d;
  if(d.chatting>livePeak)livePeak=d.chatting;
  if(!liveHist.length)sampleLive();
  paintLive(prev);
}
function sampleLive(){
  if(!live)return;
  liveHist.push({ts:Date.now(),chatting:live.chatting,online:live.online});
  if(liveHist.length>LIVE_HIST_MAX)liveHist.shift();
  const el=$('#liveSpark');if(el)liveSpark(el);
}
setInterval(sampleLive,2000);
function paintLive(prev){
  if(!live)return;
  const set=(el,v,changed)=>{el.textContent=num(v);if(changed){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}};
  const lc=$('#lpChat'),lo=$('#lpOnline');
  if(lc)set(lc,live.chatting,prev&&prev.chatting!==live.chatting);
  if(lo)lo.textContent=num(live.online);
  document.querySelectorAll('[data-live]').forEach(el=>{
    const k=el.dataset.live;
    const v=k==='peak'?livePeak:live[k];
    if(v===undefined)return;
    set(el,v,prev&&k!=='peak'&&prev[k]!==v);
  });
  const sb=$('#liveSplit');
  if(sb){
    const t=Math.max(1,live.chatting);
    sb.innerHTML=`<i style="width:${live.voice/t*100}%;background:var(--s1)"></i><i style="width:${live.text/t*100}%;background:var(--s2)"></i>`;
  }
  document.title=`(${live.chatting}) TalkLive - Owner Dashboard`;
}
/* Chatting (filled) against online (line) for the last ten minutes. */
function liveSpark(el){
  const pts=liveHist;
  const W=el.clientWidth||600,H=70,P=4;
  if(pts.length<2){el.innerHTML='<div class="muted" style="font-size:.76rem">Collecting the last 10 minutes…</div>';return;}
  const max=Math.max(1,...pts.map(p=>Math.max(p.online,p.chatting)));
  /* Newest sample on the right edge; the window fills in from the right. */
  const x=(i)=>P+((LIVE_HIST_MAX-pts.length+i)/(LIVE_HIST_MAX-1))*(W-2*P);
  const y=(v)=>H-P-(v/max)*(H-2*P);
  const line=(k)=>pts.map((p,i)=>`${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(' ');
  el.innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;height:${H}px">
    <defs><linearGradient id="lsg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:var(--accent);stop-opacity:.45"/><stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" style="stroke:var(--grid)"/>
    <polygon points="${x(0).toFixed(1)},${H-P} ${line('chatting')} ${x(pts.length-1).toFixed(1)},${H-P}" fill="url(#lsg)"/>
    <polyline points="${line('chatting')}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="${line('online')}" fill="none" style="stroke:var(--s3)" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/>
  </svg>`;
}

/* Tabs live in the URL hash, so a refresh, a bookmark or the browser Back
   button all land on the section the owner was actually looking at. */
function go(id){
  if(!TAB_IDS.includes(id))id='overview';
  closeModal();tip(false);
  if(id!==tab){
    tab=id;
    /* Clear the old section straight away: before, it stayed on screen until
       the new one had loaded, so a tap looked like it had done nothing. */
    renderedTab=null;
    const t=TABS.find(x=>x[0]===id);
    $('#main').innerHTML=`<div class="loading"><span class="spin"></span>Loading ${esc(t[1])}…</div>`;
  }
  if(location.hash.slice(1)!==id)location.hash=id;
  renderNav();load();window.scrollTo({top:0});
}
window.addEventListener('hashchange',()=>{
  const id=location.hash.slice(1);
  if(TAB_IDS.includes(id)&&id!==tab&&!$('#dash').classList.contains('hidden'))go(id);
});

function scheduleRefresh(){
  clearInterval(timer);
  if(!paused)timer=setInterval(()=>load(false),REFRESH_MS());
  const b=$('#refreshBtn');
  if(b){
    b.className='hbtn '+(paused?'paused':'live');
    b.innerHTML=(paused?'▶':'⏸')+`<span class="lbl" id="refreshLbl"> ${paused?'paused':'auto'}</span>`;
    b.title=paused?'Auto-refresh paused - click to resume':`Auto-refreshing every ${REFRESH_MS()/1000}s - click to pause`;
  }
}
function togglePause(){
  paused=!paused;
  scheduleRefresh();
  if(!paused)load();
  toast(paused?'Auto-refresh paused':'Auto-refresh on',paused?'Tables stay frozen until you resume. Live chat counters keep streaming.':`Refreshing every ${REFRESH_MS()/1000}s.`,paused?'warn':'good');
}
function startDash(){
  const hash=location.hash.slice(1);
  if(TAB_IDS.includes(hash))tab=hash;
  renderNav();load();scheduleRefresh();startLiveStream();
}
/* `force` defaults to true so every click and keypress repaints immediately;
   the poll timer passes false, because typing into a filter box or having a
   dialog open must not be interrupted by a repaint underneath. */
async function load(force){
  scheduleRefresh();
  if(force===false){
    /* Nobody is looking: don't make the server build reports for a hidden tab. */
    if(document.hidden)return;
    /* Reading a transcript is the one view where a repaint is destructive:
       it would reload the thread and throw away where you had scrolled to. */
    if(tab==='chats'&&chatOpen)return;
    /* Nor while a voice message is playing: the repaint would cut it off. */
    if(tab==='voicenotes'&&[...document.querySelectorAll('#main audio')].some(a=>!a.paused))return;
    const busy=overlayEl||(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    if(busy&&Date.now()-lastLoadTs<60000)return;
  }
  const seq=++loadSeq,forTab=tab;
  quiet=renderedTab===forTab;
  $('#main').classList.toggle('quiet',quiet);
  try{
    if(tab==='overview')await viewOverview();
    else if(tab==='activity')await viewActivity();
    else if(tab==='ai')await viewBot();
    else if(tab==='audience')await viewAudience();
    else if(tab==='experience')await viewExperience();
    else if(tab==='live')await viewLive();
    else if(tab==='reports')await viewReports();
    else if(tab==='bans')await viewBans();
    else if(tab==='warnings')await viewWarnings();
    else if(tab==='chats')await viewChats();
    else if(tab==='voicenotes')await viewVoiceNotes();
    else if(tab==='accounts')await viewAccounts();
    else if(tab==='talktime')await viewTalkTime();
    else if(tab==='games')await viewGames();
    else if(tab==='revenue')await viewRevenue();
    else if(tab==='errors')await viewErrors();
    else if(tab==='feedback')await viewFeedback();
    else if(tab==='audit')await viewAudit();
    else if(tab==='settings')await viewSettings();
    if(seq!==loadSeq)return;
    renderedTab=forTab;
    /* Once the entrance animation has played, later repaints of this section
       (filters, sort, window presets) stay quiet too. */
    if(!quiet)setTimeout(()=>{if(seq===loadSeq){quiet=true;$('#main').classList.add('quiet');}},700);
    lastLoadTs=Date.now();loadFailures=0;
    paintLive(null);
    const sp=$('#liveSpark');if(sp)liveSpark(sp);
    stampUpdated();
  }catch(e){
    if(e.message==='auth'||seq!==loadSeq)return;
    loadFailures++;
    /* A blip while polling shouldn't wipe a screenful of data - only replace the
       view if this section was never drawn, or the failure is persistent. */
    if(renderedTab!==forTab||loadFailures>2)$('#main').innerHTML=`<div class="card"><h2>⚠️ Could not load this section</h2><div class="muted">${esc(e.message)}</div><div class="rowbtns" style="margin-top:12px"><button onclick="load()">Try again</button></div></div>`;
    else toast('Refresh failed',e.message+' - showing the last good data.','warn');
  }
}
/* Only the newest load may paint (see loadSeq). A view fetches through this; an
   answer that arrives after the owner has moved on never resolves, so the view
   simply stops instead of drawing over the section now on screen. */
const STALE=new Promise(()=>{});
async function vapi(p){
  const s=loadSeq,t=tab;
  const r=await api(p);
  return s===loadSeq&&t===tab?r:STALE;
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!paused&&!$('#dash').classList.contains('hidden'))load(false);
});

/* A quiet "as of" line, so a number that hasn't moved in ten minutes is
   obviously stale rather than silently wrong. */
function stampUpdated(){
  const el=$('#updStamp');if(!el)return;
  const t=new Date();
  el.innerHTML=`Updated ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')} · ${paused?'auto-refresh paused':'auto-refresh every '+REFRESH_MS()/1000+'s'}`;
}

/* Re-rendering a whole view steals focus from the filter box that triggered
   it, so put the caret back where the owner left it. */
function keepFocus(sel){
  const el=$(sel);if(!el)return;
  el.focus();
  const n=el.value.length;
  try{el.setSelectionRange(n,n);}catch(e){}
}
let filterTimer=null;
function onFilterInput(inp,set,render){
  inp.oninput=()=>{set(inp.value);clearTimeout(filterTimer);filterTimer=setTimeout(render,220);};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(filterTimer);render();}});
}

/* ---------- global search ---------- */
let searchTimer=null,searchSeq=0;
/* Opening a search hit lands on its tab already filtered to what you typed,
   instead of the unfiltered list you then had to search again. */
function filterTabTo(kind,q){
  if(kind==='accounts')accQ=q;
  else if(kind==='live'){liveQ=q;liveStatus='';}
  else if(kind==='chats'){chatQuery=q;chatOpen=null;}
  else if(kind==='feedback')fbQ=q;
  else if(kind==='reports'){repFilter='all';repUser=null;repQ=q;}
  else if(kind==='bans')banFilter='all';
}
function openSearch(){
  modal('🔍 Search everything',
    `<input id="gq" placeholder="Username, country, IP, ban reason, message text…" autocomplete="off">
     <div class="muted" style="margin-top:8px;font-size:.78rem">Looks across accounts, live users, bans, reports, feedback and chat messages.</div>
     <div id="gres" class="sres" style="margin:8px -16px 0"></div>`,
    (sheet)=>{
      const inp=sheet.querySelector('#gq'),out=sheet.querySelector('#gres');
      inp.focus();
      const run=async()=>{
        const q=inp.value.trim(),my=++searchSeq;
        if(q.length<2){out.innerHTML='<div class="sgroup">Type at least 2 characters</div>';return;}
        out.innerHTML='<div class="sgroup">Searching…</div>';
        try{
          const r=await api('search?q='+encodeURIComponent(q));
          if(my!==searchSeq)return;
          out.innerHTML=r.groups.map(g=>`<div class="sgroup">${esc(g.label)} · ${g.items.length}</div>`
            +g.items.map(it=>`<button class="sitem" data-go="${esc(g.kind)}"><b>${esc(it.title)}</b><span class="s2">${esc(it.sub||'')}${it.ts?' · '+ago(it.ts):''}</span></button>`).join('')).join('')
            ||'<div class="sgroup">Nothing found</div>';
          out.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{filterTabTo(b.dataset.go,q);closeModal();go(b.dataset.go);});
        }catch(e){if(my!==searchSeq)return;out.innerHTML=`<div class="sgroup">Search failed: ${esc(e.message)}</div>`;}
      };
      inp.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(run,220);});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);run();}});
    });
}

/* ---------- keyboard shortcuts ---------- */
const SHORTCUTS=[['/ or Ctrl K','Search everything'],['1 - 9','Jump to a section'],['r','Refresh now'],['p','Pause / resume auto-refresh'],['t','Switch theme'],['e','Export the current tab as CSV'],['?','This help'],['Esc','Close a dialog']];
function openHelp(){
  modal('⌨️ Keyboard shortcuts',
    `<div class="kbdlist">${SHORTCUTS.map(([k,d])=>`<kbd>${esc(k)}</kbd><span>${esc(d)}</span>`).join('')}</div>`,
    null,{mid:true});
}
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){closeModal();return;}
  const t=e.target;
  const typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
  if((e.key==='k'||e.key==='K')&&(e.metaKey||e.ctrlKey)){e.preventDefault();if(!$('#dash').classList.contains('hidden'))openSearch();return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if($('#dash').classList.contains('hidden'))return;
  if(e.key==='/'){e.preventDefault();openSearch();}
  else if(e.key==='?')openHelp();
  else if(e.key==='r')load();
  else if(e.key==='p')togglePause();
  else if(e.key==='t')cycleTheme();
  else if(e.key==='e'){const l=document.querySelector('#main a[data-export]');if(l)l.click();else toast('Nothing to export','This section has no CSV export.','warn');}
  else if(/^[1-9]$/.test(e.key)){const t2=TABS[Number(e.key)-1];if(t2)go(t2[0]);}
});

/* A download link rather than a fetch: the dashboard cookie is already scoped

}

/* ---------- audience & experience ----------
   Who uses TalkLive (gender, age group, device, language, new vs returning)
   and how it goes for them (wait, give-ups, call length, pairings, ratings).
   Gender and age are self-reported and never verified. People are counted once
   per person per UTC day, so a 7-day figure is "person-days". */
let audRange=7,audCache=null;
const G_COLOR={male:'var(--s1)',female:'var(--s5)',unspecified:'var(--muted)'};
const G_LABEL={male:'♂ Male',female:'♀ Female',unspecified:'Not stated'};
const LVL_PILL={good:'good',info:'info',warn:'warn',crit:'crit'};
const LC_LABEL={'new':'🆕 New (first day)','1-7d':'Returning · within a week','8-30d':'Returning · 1-4 weeks','30d+':'Loyal · 30+ days','unknown':'Unknown'};
function audRangeBar(kind){
  return `<div class="tbar" style="margin:0 0 12px">
    <div class="seg">${[[1,'Today (UTC)'],[7,'Last 7 days'],[30,'Last 30 days']].map(([v,l])=>`<button data-ar="${v}" class="${audRange===v?'on':''}">${l}</button>`).join('')}</div>
    <span style="margin-left:auto"><a class="lnk" href="/owner/api/export/audience.csv?range=${audRange}" download>⬇ Export ${kind} CSV</a></span></div>`;
}
function wireAudRange(){document.querySelectorAll('[data-ar]').forEach(b=>b.onclick=()=>{audRange=Number(b.dataset.ar);load();});}
/* One 100% bar split by share, every segment labelled so identity is never
   colour alone. */
function stackBar(parts,total){
  const t=total||parts.reduce((a,p)=>a+p.n,0);
  if(!t)return '<div class="muted">No data yet.</div>';
  return `<div class="stack">${parts.filter(p=>p.n>0).map(p=>`<i style="width:${p.n/t*100}%;background:${p.color}" title="${esc(p.label)}: ${num(p.n)} (${pctOf(p.n,t)})"></i>`).join('')}</div>
  <div class="legend" style="margin-top:8px">${parts.filter(p=>p.n>0||parts.length<=3).map(p=>`<span><i style="background:${p.color}"></i>${esc(p.label)} <b>${pctOf(p.n,t)}</b> <span class="muted">(${num(p.n)})</span></span>`).join('')}</div>`;
}
/* Bars with a count and a share. */
function shareBars(rows,color){
  const max=Math.max(1,...rows.map(r=>r.n));
  return rows.map(r=>`<div class="hrow" style="grid-template-columns:minmax(100px,190px) 1fr 96px"><div title="${esc(r.label)}">${esc(r.label)}</div><div><div class="hbar" style="width:${Math.max(1,r.n/max*100)}%;background:${r.color||color}${r.dim?';opacity:.45':''}"></div></div><div class="n">${num(r.n)} · <b>${r.pct==null?'-':r.pct+'%'}</b></div></div>`).join('')||'<div class="muted">No data yet.</div>';
}
const entriesToShare=(list,labelFn)=>{const t=list.reduce((a,e)=>a+e[1],0);return list.map(([k,n])=>({label:labelFn?labelFn(k):k,n,pct:t?Math.round(n/t*1000)/10:0}));};
const LANGS={en:'English',es:'Spanish',pt:'Portuguese',fr:'French',de:'German',it:'Italian',ru:'Russian',ar:'Arabic',hi:'Hindi',ur:'Urdu',bn:'Bengali',id:'Indonesian',tr:'Turkish',fa:'Persian',zh:'Chinese',ja:'Japanese',ko:'Korean',vi:'Vietnamese',th:'Thai',pl:'Polish',nl:'Dutch',uk:'Ukrainian',fil:'Filipino',tl:'Tagalog',ms:'Malay',sw:'Swahili'};

/* ---------- activity: hour-by-hour, daily and weekly reports ---------- */
let actTz=null,actMetric='uniques';
const ACT_METRICS=[['uniques','Unique visitors'],['visits','Visits'],['connections','Connections'],['matches','Matches'],['messages','Messages'],['bots','Crawler hits']];

/* Timezone list from the browser (falls back to a short list on old engines).
   The owner's own zone is preselected, so "today" matches the day they are
   actually living in rather than UTC. */
function tzOptions(selected){
  let zones=[];
  try{zones=Intl.supportedValuesOf('timeZone');}catch(e){zones=[];}
  if(!zones.length)zones=['UTC','Europe/London','Europe/Berlin','Europe/Istanbul','Asia/Dubai','Asia/Karachi','Asia/Kolkata','Asia/Dhaka','Asia/Jakarta','Asia/Shanghai','Asia/Tokyo','Australia/Sydney','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Sao_Paulo','Africa/Lagos','Africa/Cairo'];
  if(!zones.includes('UTC'))zones.unshift('UTC');
  if(selected&&!zones.includes(selected))zones.unshift(selected);
  return zones.map(z=>`<option value="${esc(z)}"${z===selected?' selected':''}>${esc(z)}</option>`).join('');
}
function browserTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';}catch(e){return 'UTC';}}

/* One bar per local hour. Hours that haven't happened yet today are greyed so a
   half-empty afternoon never looks like a traffic collapse. */
function hourBars(el,hours,metric,upToHour){
  const vals=hours.map(h=>h[metric]||0);
  const max=Math.max(1,...vals);
  el.innerHTML=`<div class="hours">${hours.map((h,i)=>{
    const v=h[metric]||0;
    const cls=upToHour!=null&&i>upToHour?'future':(i===upToHour?'now':'');
    return `<div class="hcol ${cls}" title="${String(i).padStart(2,'0')}:00 - ${num(v)}"><div class="hfill" style="height:${Math.max(1,v/max*100)}%"></div></div>`;
  }).join('')}</div>
  <div class="hourlbl">${hours.map((h,i)=>`<span>${i%3===0?String(i).padStart(2,'0'):''}</span>`).join('')}</div>`;
}

/* ---------- custom time window: "7am until 7am the next day" ---------- */
let winFrom='',winTo='',winMetric='visits';
let winStart=(()=>{try{const s=localStorage.getItem('tl_day_start');const v=Number(s);return s!==null&&s!==''&&v>=0&&v<=23?v:7;}catch(e){return 7;}})();
const dayAdd=(k,n)=>new Date(Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))+n*86400000).toISOString().slice(0,10);
const hh=(h)=>String(h).padStart(2,'0');
/* Latest finished window that starts at the business-day hour. */
function defaultWindow(now){
  const end=now.hour>=winStart?now.day:dayAdd(now.day,-1);
  return [dayAdd(end,-1)+'T'+hh(winStart)+':00',end+'T'+hh(winStart)+':00'];
}
function winPresets(now){
  const nowStr=now.day+'T'+hh(now.hour)+':'+hh(now.minute);
  const todayStart=(now.hour>=winStart?now.day:dayAdd(now.day,-1))+'T'+hh(winStart)+':00';
  const [pf,pt]=defaultWindow(now);
  const back=(hrs)=>{const t=new Date(Date.UTC(+now.day.slice(0,4),+now.day.slice(5,7)-1,+now.day.slice(8,10),now.hour,now.minute)-hrs*3600000).toISOString();return t.slice(0,16);};
  return [
    [`Last full day (${hh(winStart)}:00 → ${hh(winStart)}:00)`,pf,pt],
    [`Current day since ${hh(winStart)}:00`,todayStart,nowStr],
    ['Last 24 hours',back(24),nowStr],
    ['Last 12 hours',back(12),nowStr],
    ['Last 6 hours',back(6),nowStr],
  ];
}
function windowBars(el,hours,metric){
  if(!hours.length){el.innerHTML='<div class="muted">No hours in this window yet.</div>';return;}
  const max=Math.max(1,...hours.map(x=>x[metric]||0));
  const step=Math.ceil(hours.length/12);
  el.innerHTML=`<div class="hours" style="grid-template-columns:repeat(${hours.length},1fr)">${hours.map(x=>`<div class="hcol" title="${esc(x.label)} - ${num(x[metric])}"><div class="hfill" style="height:${Math.max(1,(x[metric]||0)/max*100)}%"></div></div>`).join('')}</div>
  <div class="hourlbl" style="grid-template-columns:repeat(${hours.length},1fr)">${hours.map((x,i)=>`<span>${i%step===0?esc(x.label.slice(11,13)):''}</span>`).join('')}</div>`;
}

async function botAnswer(kind){

  const sum7=(f)=>o.series.slice(-7).reduce((a,d)=>a+(d[f]||0),0);
